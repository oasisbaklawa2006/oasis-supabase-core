---
# PostgreSQL migrations/tests are not T-SQL; exclude from Codacy SQL compatibility rules.
exclude_paths:
  - 'supabase/migrations/**'
  - 'supabase/tests/**'
  - '**/*.test.ts'
  # Governed media fetch: URLs are HTTPS/host-validated before fetch (Codacy SSRF false positive).
  - 'supabase/functions/_shared/whatsappGovernedMediaFetch.ts'

engines:
  eslint-8:
    # security-node detect-unhandled-async-errors false positive on governed worker:
    # handleRequest try/catch + serve().catch() bound all paths; helpers use handleAsync.
    # Scoped to ESLint engine only — DeepSource and other Codacy engines still scan this file.
    exclude_paths:
      - 'supabase/functions/whatsapp-packet-ai-worker/index.ts'
    disable_rules:
      - ESLint8_security-node_detect-unhandled-async-errors

---
# PostgreSQL migrations/tests are not T-SQL; exclude from Codacy SQL compatibility rules.
exclude_paths:
  - 'supabase/migrations/**'
  - 'supabase/tests/**'
  # These are PostgreSQL-catalog-specific, read-only schema census queries.
  # Migration CI executes them against a fresh canonical replay; generic SQL
  # compatibility analysis misclassifies PostgreSQL catalog syntax.
  - 'scripts/sql/public-schema-semantic-manifest.sql'
  - 'scripts/sql/platform-schema-semantic-manifest.sql'
  - '**/*.test.ts'
  # Certification harnesses: synthetic-only tooling, not production application code.
  # Safety enforced by preview guards, pgTAP, governed CI, and release-cert assertions.
  - 'scripts/whatsapp-stage1b-cert/**'
  - 'scripts/whatsapp-stage2-historical/**'
  # Governed media fetch: URLs are HTTPS/host-validated before fetch (Codacy SSRF false positive).
  - 'supabase/functions/_shared/whatsappGovernedMediaFetch.ts'
  # Production secrets resolver: HTTPS-only fetch to api.supabase.com with bearer token.
  - 'scripts/resolve-production-gemini-secret.py'

engines:
  eslint-8:
    # security-node detect-unhandled-async-errors is a verified false positive on this
    # worker: all async transport uses handleAsync (Promise.resolve + .catch tuple) or
    # async try/catch at serve/handleRequest boundaries. Rule disabled project-wide so
    # whatsapp-packet-ai-worker remains fully scanned by all other ESLint-8 rules.
    disable_rules:
      - ESLint8_security-node_detect-unhandled-async-errors

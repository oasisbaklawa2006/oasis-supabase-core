---
# PostgreSQL migrations/tests are not T-SQL; exclude from Codacy SQL compatibility rules.
exclude_paths:
  - 'supabase/migrations/**'
  - 'supabase/tests/**'
  - '**/*.test.ts'
  # Governed media fetch: URLs are HTTPS/host-validated before fetch (Codacy SSRF false positive).
  - 'supabase/functions/_shared/whatsappGovernedMediaFetch.ts'
  # Packet AI worker: dispatch helpers throw fail-closed; handleRequest try/catch and
  # serve().catch() bound all async paths. Codacy ESLint "unhandled async" is a false
  # positive on governed rethrow-to-central-handler pattern (see PR #102 closure pass).
  - 'supabase/functions/whatsapp-packet-ai-worker/index.ts'

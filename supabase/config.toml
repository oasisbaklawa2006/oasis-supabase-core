project_id = "tcxvcatsqqertcnycuop"

# Approved non-production Edge Runtime secrets for Supabase preview branches.
# Values are supplied via encrypted supabase/.env.preview (branching executor)
# and/or .github/workflows/sync-preview-cert-edge-secrets.yml — never plaintext
# in Git. Production values remain governed separately on tcxvcatsqqertcnycuop.
[edge_runtime.secrets]
GEMINI_API_KEY = "env(GEMINI_API_KEY)"
WHATSAPP_MEDIA_ALLOWED_HOSTS = "env(WHATSAPP_MEDIA_ALLOWED_HOSTS)"
WA_STAGE1B_CERT_SECRET = "env(WA_STAGE1B_CERT_SECRET)"

# Only functions explicitly approved for branch/preview deployment are declared
# here. Production webhooks and controlled cron bridges are deployed through
# dedicated approval-gated workflows, never by a broad preview deployment.

[functions.catalogue-ai-copy]
verify_jwt = true

[functions.test-integration]
verify_jwt = true

# Authenticated, read-only WhatsApp interpretation helper used by the operator inbox.
# The function re-loads authoritative inbound evidence under caller RLS and cannot
# create/promote orders, reserve stock, authorize disclosure, or send replies.
[functions.whatsapp-content-interpret]
verify_jwt = true

# Internal service-role-only processor. It automatically interprets a stitched
# WhatsApp packet and persists an append-only advisory conclusion for inbox readers.
[functions.whatsapp-packet-ai-worker]
verify_jwt = true

# Custom BRIDGE_CRON_SECRET authentication is enforced in the function body.
# BRIDGE_ENABLED must remain false unless a controlled ingestion window is approved.
[functions.whatsapp-studio-inbox-bridge]
verify_jwt = false

# Governed staff/QA account provisioning (Central issue #368, Lane 1).
# Repository-ready; production runtime certification pending -- see
# docs/security/EDGE_FUNCTION_RUNTIME_CERTIFICATION_2026-07-31.md.
[functions.admin-provision-user]
verify_jwt = true

# NON-PRODUCTION preview-only Stage-1B certification runner.
# Custom WA_STAGE1B_CERT_SECRET auth enforced in function body.
# Must never deploy to production.
[functions.whatsapp-stage1b-cert-runner]
verify_jwt = false

# Intentionally not declared:
# - whatsapp-webhook: production Meta callback; dedicated high-risk deployment only.
# - generate-product-attributes: quarantined pending replacement of unverified
#   nutrition/GST/HSN generation and proper authorization.

name: Production Migration Drift Watch

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'docs/reconciliation/**'
      - 'scripts/verify-production-migration-ledger.sh'
      - 'scripts/verify-production-schema-semantic-drift.sh'
      - 'scripts/sql/*schema-semantic-manifest.sql'
      - 'scripts/check-migration-governance.sh'
      - 'scripts/check-migration-base-monotonicity.sh'
      - 'scripts/check-migration-history-sequence.sh'
      - 'scripts/tests/verify-check-migration-history-sequence.sh'
      - '.github/workflows/production-migration-drift-watch.yml'
  schedule:
    - cron: '17 2 * * *'
    - cron: '47 8 * * *'
    - cron: '17 14 * * *'
    - cron: '47 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migration-drift-watch
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.110.0
  EXPECTED_PROJECT_REF: tcxvcatsqqertcnycuop
  # Certified post-incident activation point; see
  # docs/reconciliation/MIGRATION_DISCIPLINE_REBASELINE_20260831.md.
  MIGRATION_DISCIPLINE_BASE_SHA: 2e45e864e8e2e9b136623c9db2f2cc443a1f7af3

jobs:
  ledger-watch:
    name: Production migration and semantic schema parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production-readonly
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EVENT_NAME: ${{ github.event_name }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout canonical release state
        uses: actions/checkout@v4
        with:
          # Push checks are anchored to the exact event commit. Scheduled/manual
          # watches intentionally inspect the current protected main branch.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert production identity and mainline chronology
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_PROJECT_REF"
          test -n "${SUPABASE_DB_URL:-}"
          [[ "$SUPABASE_DB_URL" == *"$EXPECTED_PROJECT_REF"* ]]
          if [[ "$EVENT_NAME" == "push" ]]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]] || ! git rev-parse --verify "${PUSH_BEFORE}^{commit}" >/dev/null 2>&1; then
              echo "Drift watch cannot resolve the complete push base: '${PUSH_BEFORE:-missing}'" >&2
              exit 1
            fi
            bash scripts/check-migration-base-monotonicity.sh "$PUSH_BEFORE"
            bash scripts/check-migration-governance.sh "$PUSH_BEFORE"
          else
            bash scripts/check-migration-base-monotonicity.sh "$MIGRATION_DISCIPLINE_BASE_SHA"
            bash scripts/check-migration-governance.sh "$MIGRATION_DISCIPLINE_BASE_SHA"
          fi
          bash scripts/check-migration-history-sequence.sh "$MIGRATION_DISCIPLINE_BASE_SHA"

      - name: Set up pinned Supabase CLI
        # v3 resolved to this exact commit in the certified 2026-08-28 production release.
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Enforce production-write authority (PRODUCTION MIGRATION INVARIANT)
        run: bash scripts/check-production-write-authority.sh

      - name: Enforce production project reference authority
        run: bash scripts/check-production-ref-authority.sh

      - name: Certify production read-only database credential
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            echo "PRODUCTION READONLY CREDENTIAL CERTIFICATION FAILED: $*" >&2
            exit 1
          }

          role_name="$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select current_user')"
          [[ "$role_name" == 'supabase_read_only_user' ]] \
            || fail "credential must connect as supabase_read_only_user; got ${role_name:-missing}"

          role_facts="$(psql "$SUPABASE_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "
          select
            rolsuper,
            rolcreaterole,
            rolcreatedb,
            rolreplication,
            coalesce(array_to_string(rolconfig, ','), ''),
            rolbypassrls
          from pg_roles
          where rolname = current_user;
          ")"
          IFS='|' read -r is_super can_create_role can_create_db can_replicate role_config bypass_rls <<<"$role_facts"
          [[ "$is_super" == 'f' ]] || fail 'credential must not be superuser'
          [[ "$can_create_role" == 'f' ]] || fail 'credential must not create roles'
          [[ "$can_create_db" == 'f' ]] || fail 'credential must not create databases'
          [[ "$can_replicate" == 'f' ]] || fail 'credential must not have replication authority'
          [[ ",$role_config," == *",default_transaction_read_only=on,"* ]] \
            || fail 'credential must default every transaction to read-only'
          [[ "$bypass_rls" == 'f' ]] || fail 'credential must not bypass row-level security'

          dangerous_settable_roles="$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
          with recursive settable(role_oid) as (
            select m.roleid
            from pg_auth_members m
            join pg_roles login on login.oid = m.member
            where login.rolname = session_user::name
            union
            select m.roleid
            from pg_auth_members m
            join settable s on m.member = s.role_oid
          )
          select count(*)
          from settable s
          join pg_roles r on r.oid = s.role_oid
          where r.rolsuper
             or r.rolcreatedb
             or r.rolcreaterole
             or r.rolreplication
             or r.rolbypassrls;
          ")"
          [[ "$dangerous_settable_roles" == '0' ]] \
            || fail "credential can SET ROLE into ${dangerous_settable_roles} privileged role(s)"

          app_dml_count="$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
          select count(*)
          from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          where c.relkind in ('r','p')
            and n.nspname in ('public','auth','storage')
            and has_table_privilege(current_user, c.oid, 'INSERT,UPDATE,DELETE,TRUNCATE');
          ")"
          [[ "$app_dml_count" == '0' ]] \
            || fail "credential has DML privilege on ${app_dml_count} application table(s)"

          create_facts="$(psql "$SUPABASE_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "
          select
            has_database_privilege(current_user, current_database(), 'CREATE'),
            has_schema_privilege(current_user, 'public', 'CREATE');
          ")"
          IFS='|' read -r can_create_database_object can_create_public_object <<<"$create_facts"
          [[ "$can_create_database_object" == 'f' ]] || fail 'credential must not CREATE in the production database'
          [[ "$can_create_public_object" == 'f' ]] || fail 'credential must not CREATE in public schema'

          # Prove privileges, not merely the role's read-only session default.
          # Separate -c invocations start a new transaction after changing the default.
          # WHERE false guarantees zero data changes even if the credential were misconfigured writable.
          set +e
          write_probe_output="$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 \
            -c 'set default_transaction_read_only = off;' \
            -c 'update public.companies set id = id where false;' 2>&1)"
          write_probe_status=$?
          set -e
          if [[ "$write_probe_status" -eq 0 ]]; then
            fail 'zero-row UPDATE unexpectedly succeeded in a writable transaction'
          fi
          if [[ "$write_probe_output" != *'permission denied'* ]]; then
            fail 'zero-row UPDATE failed for an unexpected reason; boundary cannot be certified'
          fi

          printf 'Production read-only credential certified: role=%s application_dml=0 create_db=f create_public=f bypass_rls=%s default_transaction_read_only=on\n' \
            "$role_name" "$bypass_rls"

      - name: Verify exact ledger equality or append-only pending state
        run: bash scripts/verify-production-migration-ledger.sh

      - name: Fail when a merged migration remains undeployed
        shell: bash
        run: |
          set -euo pipefail
          pending="$(awk '/^Pending append-only versions:/{flag=1;next} flag{print}' production-migration-ledger-report.txt | sed -e '/^[[:space:]]*$/d' -e '/^none$/d')"
          if [[ -n "$pending" ]]; then
            echo "Merged migration(s) remain undeployed:" >&2
            echo "$pending" >&2
            exit 1
          fi

      - name: Verify production app-governed schema semantic parity
        shell: bash
        run: bash scripts/verify-production-schema-semantic-drift.sh

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-drift-${{ github.run_id }}
          path: |
            production-migration-ledger-report.txt
            production-schema-semantic-local.manifest
            production-schema-semantic-local.manifest.stderr.txt
            production-schema-semantic-remote.manifest
            production-schema-semantic-remote.manifest.stderr.txt
            production-schema-semantic-diff.txt
            production-schema-local-start-sanitized.log
          if-no-files-found: warn
          retention-days: 90

name: Apply 283 review repairs

on:
  push:
    branches:
      - fix/281-b2b-approval-notification-authority
    paths:
      - .github/workflows/apply-283-review-repairs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/281-b2b-approval-notification-authority
          fetch-depth: 0
      - name: Apply verified CodeRabbit repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('supabase/functions/_shared/notifyEventAuthority.ts')
          h = helper.read_text()
          old = '''export function normalizePhone(value: string | null | undefined): string | null {\n  if (!value) return null;\n  const digits = value.replace(/[^0-9]/g, "");\n  const normalized = digits.length === 10 ? `91${digits}` : digits;\n  return normalized.length >= 10 && normalized.length <= 15 ? normalized : null;\n}\n'''
          new = '''/**\n * Approval contacts follow the canonical B2B India-mobile contract used by\n * normalize_b2b_access_mobile_v2. Reject ambiguous/international values rather\n * than silently reinterpreting them as Indian recipients.\n */\nexport function normalizePhone(value: string | null | undefined): string | null {\n  if (!value) return null;\n  const digits = value.replace(/[^0-9]/g, "");\n  if (/^[6-9][0-9]{9}$/.test(digits)) return `91${digits}`;\n  if (/^0[6-9][0-9]{9}$/.test(digits)) return `91${digits.slice(1)}`;\n  if (/^91[6-9][0-9]{9}$/.test(digits)) return digits;\n  return null;\n}\n'''
          if old not in h:
              raise SystemExit('normalizePhone marker not found')
          helper.write_text(h.replace(old, new, 1))

          test = Path('supabase/functions/_shared/notifyEventAuthority.test.ts')
          t = test.read_text()
          old = '''Deno.test("invalid recipient values are dropped rather than guessed", () => {\n  assertEquals(normalizeEmail("not-an-email"), null, "invalid email");\n  assertEquals(normalizePhone("123"), null, "invalid phone");\n});\n'''
          new = '''Deno.test("invalid or non-Indian recipient values are dropped rather than guessed", () => {\n  assertEquals(normalizeEmail("not-an-email"), null, "invalid email");\n  assertEquals(normalizePhone("123"), null, "invalid phone");\n  assertEquals(normalizePhone("2025550123"), null, "ambiguous non-Indian 10-digit phone");\n  assertEquals(normalizePhone("09891162212"), "919891162212", "India trunk prefix");\n  assertEquals(normalizePhone("+91 98911 62212"), "919891162212", "explicit India country code");\n});\n'''
          if old not in t:
              raise SystemExit('phone test marker not found')
          test.write_text(t.replace(old, new, 1))

          p = Path('supabase/functions/notify-event/index.ts')
          text = p.read_text()
          text = text.replace(
              '.select("phone, account_manager_id, business_name")',
              '.select("phone, account_manager_id")',
              1,
          )
          old = '''        .select("contact_email, mobile_number, contact_phone")\n        .eq("business_name", company.business_name)\n        .order("created_at", { ascending: false })\n'''
          new = '''        .select("contact_email, mobile_number, contact_phone")\n        .eq("resolved_company_id", companyId)\n        .order("created_at", { ascending: false })\n'''
          if old not in text:
              raise SystemExit('buyer lookup marker not found')
          text = text.replace(old, new, 1)

          old = '''  if (error || !data) return { status: 404, body: { error: "Application not found" } };\n\n  const notification = buildApprovalNotification(data as ApprovalApplication);\n  const channels = approvalChannels(notification);\n'''
          new = '''  if (error) {\n    console.error("[notify-event] approval application lookup failed", error.message);\n    return { status: 503, body: { error: "Approval application lookup unavailable" } };\n  }\n  if (!data) return { status: 404, body: { error: "Application not found" } };\n\n  let notification: ReturnType<typeof buildApprovalNotification>;\n  try {\n    notification = buildApprovalNotification(data as ApprovalApplication);\n  } catch (error) {\n    if (error instanceof Error && error.message === "application_not_approved") {\n      return { status: 409, body: { error: "application_not_approved" } };\n    }\n    throw error;\n  }\n  const channels = approvalChannels(notification);\n'''
          if old not in text:
              raise SystemExit('approval lookup marker not found')
          text = text.replace(old, new, 1)

          old = '''    const outbox = await getOrCreateApprovalOutbox(\n      admin,\n      applicationId,\n      channel,\n      recipient,\n      notification.message,\n    );\n'''
          new = '''    let outbox;\n    try {\n      outbox = await getOrCreateApprovalOutbox(\n        admin,\n        applicationId,\n        channel,\n        recipient,\n        notification.message,\n      );\n    } catch (error) {\n      if (error instanceof Error && error.message === "approval_notification_idempotency_conflict") {\n        return { status: 409, body: { error: "approval_notification_idempotency_conflict" } };\n      }\n      throw error;\n    }\n'''
          if old not in text:
              raise SystemExit('outbox conflict marker not found')
          text = text.replace(old, new, 1)

          old = '''  try {\n    const payload = (await req.json()) as NotifyPayload;\n    const event = asString(payload.event);\n'''
          new = '''  try {\n    let payload: NotifyPayload;\n    try {\n      payload = (await req.json()) as NotifyPayload;\n    } catch {\n      return json({ error: "Invalid JSON body" }, 400);\n    }\n    const event = asString(payload.event);\n'''
          if old not in text:
              raise SystemExit('json parse marker not found')
          p.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/apply-283-review-repairs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/notifyEventAuthority.ts supabase/functions/_shared/notifyEventAuthority.test.ts supabase/functions/notify-event/index.ts .github/workflows/apply-283-review-repairs.yml
          git commit -m "fix(auth): repair approval notification review findings"
          git push origin HEAD:fix/281-b2b-approval-notification-authority

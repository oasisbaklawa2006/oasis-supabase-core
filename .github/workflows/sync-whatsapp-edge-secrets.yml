name: Verify WhatsApp Edge Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-whatsapp-edge-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-whatsapp-edge-secrets-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.110.0
  SUPABASE_PROJECT_REF: tcxvcatsqqertcnycuop

jobs:
  verify:
    name: Verify WhatsApp secrets in Supabase production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "Missing required secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          }
          test "$SUPABASE_PROJECT_REF" = "tcxvcatsqqertcnycuop"
          echo "Supabase production target is pinned and access token is available."

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify canonical and compatibility secret names exist exactly
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF")"
          available_names="$(awk -F '|' '
            NF >= 2 {
              name=$1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name ~ /^[A-Za-z][A-Za-z0-9_]*$/) print name
            }
          ' <<<"$output")"

          for name in \
            WHATSAPP_API_URL \
            WHATSAPP_API_KEY \
            WHATSAPP_CHANNEL_ID \
            WHATSAPP_ACCESS_TOKEN \
            WHATSAPP_WABA_ID \
            WHATSAPP_WEBHOOK_VERIFY_TOKEN \
            WHATSAPP_APP_SECRET \
            WHATSAPP_META_APP_SECRET \
            CLICK2API_API_KEY \
            CLICK2API_ACCESS_TOKEN
          do
            grep -Fxq "$name" <<<"$available_names" || {
              echo "Supabase secret name missing: $name" >&2
              exit 1
            }
          done
          echo "All required WhatsApp secret names are present in Supabase production."

      - name: Confirm workflow is verification-only
        shell: bash
        run: |
          set -euo pipefail
          echo "No WhatsApp credential values were read from GitHub or written to Supabase."

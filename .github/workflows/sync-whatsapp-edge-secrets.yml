name: Sync WhatsApp Edge Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-whatsapp-edge-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-whatsapp-edge-secrets-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.110.0
  SUPABASE_PROJECT_REF: tcxvcatsqqertcnycuop

jobs:
  sync:
    name: Sync WhatsApp secrets to Supabase production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
      WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
      WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_WABA_ID: ${{ secrets.WHATSAPP_WABA_ID }}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
    steps:
      - name: Validate target and secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$SUPABASE_PROJECT_REF" = "tcxvcatsqqertcnycuop"
          for name in \
            WHATSAPP_API_URL \
            WHATSAPP_API_KEY \
            WHATSAPP_CHANNEL_ID \
            WHATSAPP_ACCESS_TOKEN \
            WHATSAPP_WABA_ID \
            WHATSAPP_WEBHOOK_VERIFY_TOKEN \
            WHATSAPP_APP_SECRET
          do
            test -n "${!name:-}" || { echo "Missing required secret: $name" >&2; exit 1; }
            echo "::add-mask::${!name}"
          done

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Sync canonical and compatibility secret names
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            WHATSAPP_API_URL="$WHATSAPP_API_URL" \
            WHATSAPP_API_KEY="$WHATSAPP_API_KEY" \
            WHATSAPP_CHANNEL_ID="$WHATSAPP_CHANNEL_ID" \
            WHATSAPP_ACCESS_TOKEN="$WHATSAPP_ACCESS_TOKEN" \
            WHATSAPP_WABA_ID="$WHATSAPP_WABA_ID" \
            WHATSAPP_WEBHOOK_VERIFY_TOKEN="$WHATSAPP_WEBHOOK_VERIFY_TOKEN" \
            WHATSAPP_APP_SECRET="$WHATSAPP_APP_SECRET" \
            WHATSAPP_META_APP_SECRET="$WHATSAPP_APP_SECRET" \
            CLICK2API_API_KEY="$WHATSAPP_API_KEY" \
            CLICK2API_ACCESS_TOKEN="$WHATSAPP_ACCESS_TOKEN"

      - name: Verify secret names exist
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF")"
          for name in \
            WHATSAPP_API_URL \
            WHATSAPP_API_KEY \
            WHATSAPP_CHANNEL_ID \
            WHATSAPP_ACCESS_TOKEN \
            WHATSAPP_WABA_ID \
            WHATSAPP_WEBHOOK_VERIFY_TOKEN \
            WHATSAPP_APP_SECRET \
            WHATSAPP_META_APP_SECRET \
            CLICK2API_API_KEY \
            CLICK2API_ACCESS_TOKEN
          do
            grep -q "$name" <<<"$output" || { echo "Supabase secret name missing after sync: $name" >&2; exit 1; }
          done
          echo "All required WhatsApp secret names are present in Supabase production."

name: Apply 283 review fixes

on:
  push:
    branches:
      - fix/281-b2b-approval-notification-authority
    paths:
      - .github/workflows/apply-283-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/281-b2b-approval-notification-authority
          fetch-depth: 0
      - name: Apply bounded CodeRabbit fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          authority = Path('supabase/functions/_shared/notifyEventAuthority.ts')
          text = authority.read_text()
          old = '    phone: normalizePhone(app.mobile_number ?? app.contact_phone),'
          new = '    phone: normalizePhone(app.mobile_number) ?? normalizePhone(app.contact_phone),'
          if old not in text:
              raise SystemExit('authority phone fallback anchor not found')
          text = text.replace(old, new, 1)
          authority.write_text(text)

          index = Path('supabase/functions/notify-event/index.ts')
          text = index.read_text()

          old = '''        phone: normalizePhone(\n          company.phone ?? app?.mobile_number ?? app?.contact_phone,\n        ),'''
          new = '''        phone: normalizePhone(company.phone) ??\n          normalizePhone(app?.mobile_number) ??\n          normalizePhone(app?.contact_phone),'''
          if old not in text:
              raise SystemExit('generic buyer phone fallback anchor not found')
          text = text.replace(old, new, 1)

          fetch_anchors = [
              'const response = await fetch("https://api.resend.com/emails", {\n      method: "POST",',
              'const response = await fetch(CLICK2API_SEND_ENDPOINT, {\n      method: "POST",',
              'const response = await fetch(MSG91_WHATSAPP_ENDPOINT, {\n      method: "POST",',
          ]
          for anchor in fetch_anchors:
              if anchor not in text:
                  raise SystemExit(f'provider fetch anchor not found: {anchor.splitlines()[0]}')
              text = text.replace(
                  anchor,
                  anchor + '\n      signal: AbortSignal.timeout(10_000),',
                  1,
              )
          index.write_text(text)
          PY

          git rm .github/workflows/apply-283-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/notifyEventAuthority.ts supabase/functions/notify-event/index.ts
          git diff --cached --check
          git commit -m "fix(notify): harden provider timeout and phone fallback"
          git push origin HEAD:fix/281-b2b-approval-notification-authority

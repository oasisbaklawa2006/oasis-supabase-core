name: Sync Preview Cert Edge Secrets

# Propagates approved non-production Edge Runtime secrets onto Supabase preview
# branches. Production secrets remain governed separately via dashboard/CLI.
# Never prints, logs, or persists secret values.

on:
  workflow_dispatch:
    inputs:
      preview_project_ref:
        description: Supabase preview branch project ref (never production)
        required: true
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/config.toml"
      - "supabase/.env.preview"
      - "supabase/functions/whatsapp-stage1b-cert-runner/**"
      - "supabase/functions/_shared/stage1bCert/**"
      - "scripts/resolve-current-pr-preview-ref.sh"
      - "scripts/tests/verify-preview-edge-runtime-secrets-targeting.sh"
      - ".github/workflows/sync-preview-cert-edge-secrets.yml"

permissions:
  contents: read
  checks: read

concurrency:
  group: sync-preview-cert-edge-secrets-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.110.0
  PRODUCTION_PROJECT_REF: tcxvcatsqqertcnycuop

jobs:
  sync:
    name: Sync approved preview Edge Runtime secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY_PRIMARY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_FALLBACK: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Require independent WA_STAGE1B_CERT_SECRET
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WA_STAGE1B_CERT_SECRET:-}" ]]; then
            echo "::error::WA_STAGE1B_CERT_SECRET_REQUIRED" >&2
            exit 1
          fi

      - name: Resolve preview project ref
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.preview_project_ref }}"
          else
            ref="$(bash scripts/resolve-current-pr-preview-ref.sh)"
          fi
          if [[ "$ref" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo "::error::Refusing to write cert preview secrets to production project ref $ref" >&2
            exit 1
          fi
          if [[ ! "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Invalid preview project ref format: $ref" >&2
            exit 1
          fi
          echo "preview_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Target preview project ref: $ref"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Resolve and validate Gemini credential (no values logged)
        id: gemini
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
        run: |
          set -euo pipefail
          bash scripts/resolve-preview-gemini-credential.sh
          echo "Required credential name checks passed."

      - name: Set preview Edge Runtime secrets
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
        run: |
          set -euo pipefail
          media_hosts="${PREVIEW_REF}.supabase.co"
          if [[ -z "${WA_STAGE1B_CERT_SECRET:-}" ]]; then
            echo "::error::WA_STAGE1B_CERT_SECRET_REQUIRED" >&2
            exit 1
          fi
          supabase secrets set \
            "GEMINI_API_KEY=${GEMINI_API_KEY}" \
            "WHATSAPP_MEDIA_ALLOWED_HOSTS=${media_hosts}" \
            "WA_STAGE1B_CERT_SECRET=${WA_STAGE1B_CERT_SECRET}" \
            --project-ref "$PREVIEW_REF"
          echo "Configured GEMINI_API_KEY, WHATSAPP_MEDIA_ALLOWED_HOSTS, and WA_STAGE1B_CERT_SECRET on preview project ref $PREVIEW_REF (values not logged)."

      - name: Verify preview Edge Runtime readiness probe
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
          WA_STAGE1B_PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
          WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
        run: |
          set -euo pipefail
          sleep 90
          bash scripts/check-preview-edge-runtime-secrets-readiness.sh

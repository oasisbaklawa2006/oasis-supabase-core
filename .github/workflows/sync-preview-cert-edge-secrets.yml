name: Sync Preview Cert Edge Secrets

# Propagates approved non-production Edge Runtime secrets onto Supabase preview
# branches. Production secrets remain governed separately via dashboard/CLI.
# Never prints, logs, or persists secret values.

on:
  workflow_dispatch:
    inputs:
      preview_project_ref:
        description: Supabase preview branch project ref (never production)
        required: true
        default: jyezfiehhfgnvhzzffxr
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/config.toml"
      - "supabase/.env.preview"
      - ".github/workflows/sync-preview-cert-edge-secrets.yml"

permissions:
  contents: read

concurrency:
  group: sync-preview-cert-edge-secrets-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.110.0
  PRODUCTION_PROJECT_REF: tcxvcatsqqertcnycuop
  # Current WA Stage-1B cert preview for PR #147 / cert/wa-release-cert programme.
  DEFAULT_CERT_PREVIEW_REF: jyezfiehhfgnvhzzffxr

jobs:
  sync:
    name: Sync approved preview Edge Runtime secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY_PRIMARY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_FALLBACK: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Resolve preview project ref
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.preview_project_ref }}"
          else
            ref="${DEFAULT_CERT_PREVIEW_REF}"
          fi
          if [[ "$ref" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo "::error::Refusing to write cert preview secrets to production project ref $ref" >&2
            exit 1
          fi
          if [[ ! "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Invalid preview project ref format: $ref" >&2
            exit 1
          fi
          echo "preview_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Target preview project ref: $ref"

      - name: List Supabase secret names on production and preview (no values)
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
        run: |
          set -euo pipefail
          supabase --version
          echo "Production secret names on $PRODUCTION_PROJECT_REF:"
          supabase secrets list --project-ref "$PRODUCTION_PROJECT_REF" | awk -F '|' '
            NF >= 2 {
              name=$1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name ~ /^[A-Za-z][A-Za-z0-9_]*$/) print name
            }' || true
          echo "Preview secret names on $PREVIEW_REF:"
          supabase secrets list --project-ref "$PREVIEW_REF" | awk -F '|' '
            NF >= 2 {
              name=$1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name ~ /^[A-Za-z][A-Za-z0-9_]*$/) print name
            }' || true

      - name: Resolve and validate Gemini credential (no values logged)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::Missing required GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          }
          resolved=""
          if [[ -n "${GEMINI_API_KEY_PRIMARY:-}" ]]; then
            resolved="$GEMINI_API_KEY_PRIMARY"
          elif [[ -n "${GEMINI_API_KEY_FALLBACK:-}" ]]; then
            resolved="$GEMINI_API_KEY_FALLBACK"
          fi
          test -n "$resolved" || {
            echo "::error::Missing required GitHub secret: GEMINI_API_KEY or GOOGLE_GENERATIVE_AI_API_KEY" >&2
            exit 1
          }
          echo "::add-mask::$resolved"
          echo "GEMINI_API_KEY=$resolved" >> "$GITHUB_ENV"
          echo "Required credential name checks passed."

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Set preview Edge Runtime secrets
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
        run: |
          set -euo pipefail
          supabase secrets set "GEMINI_API_KEY=${GEMINI_API_KEY}" --project-ref "$PREVIEW_REF"
          echo "Configured GEMINI_API_KEY on preview project ref $PREVIEW_REF (value not logged)."

      - name: Verify preview secret names (digest only, no values)
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
        run: |
          set -euo pipefail
          output="$(supabase secrets list --project-ref "$PREVIEW_REF")"
          available_names="$(awk -F '|' '
            NF >= 2 {
              name=$1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name ~ /^[A-Za-z][A-Za-z0-9_]*$/) print name
            }
          ' <<<"$output")"
          grep -Fxq "GEMINI_API_KEY" <<<"$available_names" || {
            echo "::error::GEMINI_API_KEY not listed on preview $PREVIEW_REF after sync" >&2
            exit 1
          }
          echo "Preview secret name verification passed for GEMINI_API_KEY."

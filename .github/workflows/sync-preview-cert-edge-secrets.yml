name: Sync Preview Cert Edge Secrets

# Provisions approved non-production Edge Runtime secrets for ephemeral Supabase
# preview branches via encrypted supabase/.env.preview (branching executor).
# Management API writes to preview project refs are forbidden — the connected
# Supabase account only has production authority. Never prints secret values.

on:
  workflow_dispatch:
    inputs:
      preview_project_ref:
        description: Supabase preview branch project ref (never production)
        required: true
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/config.toml"
      - "supabase/.env.preview"
      - "supabase/functions/whatsapp-stage1b-cert-runner/**"
      - "supabase/functions/_shared/stage1bCert/**"
      - "scripts/resolve-current-pr-preview-ref.sh"
      - "scripts/wait-for-current-pr-preview-ref.sh"
      - "scripts/materialize-supabase-env-preview.sh"
      - "scripts/upload-preview-dotenvx-keys.sh"
      - "scripts/tests/verify-preview-edge-runtime-secrets-targeting.sh"
      - ".github/workflows/sync-preview-cert-edge-secrets.yml"

permissions:
  contents: write
  checks: read

concurrency:
  group: sync-preview-cert-edge-secrets-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.110.0
  PRODUCTION_PROJECT_REF: tcxvcatsqqertcnycuop

jobs:
  sync:
    name: Sync approved preview Edge Runtime secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require independent WA_STAGE1B_CERT_SECRET
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WA_STAGE1B_CERT_SECRET:-}" ]]; then
            echo "::error::WA_STAGE1B_CERT_SECRET_REQUIRED" >&2
            exit 1
          fi
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GEMINI_API_KEY_REQUIRED" >&2
            exit 1
          fi

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Materialize encrypted supabase/.env.preview
        id: materialize
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_DOTENV_PRIVATE_KEY: ${{ secrets.PREVIEW_DOTENV_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          result="$(bash scripts/materialize-supabase-env-preview.sh)"
          echo "$result"
          if [[ "$result" == "generated_new_dotenvx_keys" ]]; then
            echo "upload_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure production dotenvx preview authority
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_DOTENV_PRIVATE_KEY: ${{ secrets.PREVIEW_DOTENV_PRIVATE_KEY }}
          PREVIEW_DOTENVX_UPLOAD_REQUIRED: ${{ steps.materialize.outputs.upload_required }}
        run: |
          set -euo pipefail
          bash scripts/upload-preview-dotenvx-keys.sh

      - name: Resolve preview project ref
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --rebase origin "${{ github.head_ref || github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.preview_project_ref }}"
          else
            export GITHUB_PR_HEAD_SHA="$(git rev-parse HEAD)"
            ref="$(bash scripts/wait-for-current-pr-preview-ref.sh)"
          fi
          if [[ "$ref" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo "::error::Refusing to target production project ref $ref" >&2
            exit 1
          fi
          if [[ ! "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Invalid preview project ref format: $ref" >&2
            exit 1
          fi
          echo "preview_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Target preview project ref: $ref"

      - name: Wait for preview Edge Function deploy propagation
        shell: bash
        run: sleep 90

      - name: Verify preview Edge Runtime readiness probe
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
          WA_STAGE1B_PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
          WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
        run: |
          set -euo pipefail
          bash scripts/check-preview-edge-runtime-secrets-readiness.sh

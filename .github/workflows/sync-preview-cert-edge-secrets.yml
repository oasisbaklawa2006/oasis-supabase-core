name: Sync Preview Cert Edge Secrets

# PROTECTED, MANUAL key-maintenance path for the shared preview dotenvx
# authority. This is the ONLY workflow allowed to generate, rotate or upload
# DOTENV_PRIVATE_KEY_PREVIEW. Ordinary pull-request workflows (including Edge
# Function Governance) are read-only and must never write the shared key.
# It runs only on workflow_dispatch with an explicit authorization phrase and a
# change reference, inside the protected `supabase-preview-key-authority`
# environment (configure required reviewers on that environment).
# Management API writes to preview project refs are forbidden. Never prints
# secret values.

on:
  workflow_dispatch:
    inputs:
      preview_project_ref:
        description: Supabase preview branch project ref (never production)
        required: true
      rotation_authorization:
        description: Type AUTHORIZE-PREVIEW-DOTENVX-KEY-ROTATION to authorize writing the shared preview key authority
        required: true
      change_reference:
        description: Mission Control / change-ticket reference authorizing this key maintenance run
        required: true
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/config.toml"
      - "supabase/.env.preview"
      - "supabase/functions/whatsapp-stage1b-cert-runner/**"
      - "supabase/functions/_shared/stage1bCert/**"
      - "scripts/resolve-current-pr-preview-ref.sh"
      - "scripts/wait-for-current-pr-preview-ref.sh"
      - "scripts/materialize-supabase-env-preview.sh"
      - "scripts/upload-preview-dotenvx-keys.sh"
      - "scripts/verify-preview-env-decryptable.sh"
      - "scripts/upload-production-dotenvx-key.py"
      - "scripts/tests/verify-preview-edge-runtime-secrets-targeting.sh"
      - ".github/workflows/sync-preview-cert-edge-secrets.yml"

permissions:
  contents: read
  checks: read

concurrency:
  group: sync-preview-cert-edge-secrets-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.117.0
  PRODUCTION_PROJECT_REF: tcxvcatsqqertcnycuop

jobs:
  sync:
    # PR-triggered runs deliberately skip this credentialed writer; no pull-request
    # workflow is a key-rotation authority. Writing the shared key requires an
    # explicit dispatch, the exact authorization phrase and a change reference.
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.rotation_authorization == 'AUTHORIZE-PREVIEW-DOTENVX-KEY-ROTATION'
      && inputs.change_reference != ''
    name: Sync approved preview Edge Runtime secrets
    environment: supabase-preview-key-authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_KEY_ROTATION_AUTHORIZED: "true"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require independent WA_STAGE1B_CERT_SECRET
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          if [[ -z "${WA_STAGE1B_CERT_SECRET:-}" ]]; then
            echo "::error::WA_STAGE1B_CERT_SECRET_REQUIRED" >&2
            exit 1
          fi
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GEMINI_API_KEY_REQUIRED" >&2
            exit 1
          fi

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Materialize encrypted supabase/.env.preview
        id: materialize
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_DOTENV_PRIVATE_KEY: ${{ secrets.PREVIEW_DOTENV_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          result="$(bash scripts/materialize-supabase-env-preview.sh)"
          echo "$result"
          # This workflow never persists ciphertext to Git, so it must never
          # publish a freshly generated key: that would orphan the committed
          # ciphertext (the original failure mode). It may only re-publish an
          # independently held key that is proven to decrypt the committed file.
          if [[ "$result" == "generated_new_dotenvx_keys" ]]; then
            rm -f supabase/.env.preview supabase/.env.keys
            echo "::error::NEW_PREVIEW_DOTENVX_KEY_REQUIRES_PERSISTED_CIPHERTEXT" >&2
            exit 1
          fi
          if [[ "$result" == "existing_encrypted_preview_env" && -n "${PREVIEW_DOTENV_PRIVATE_KEY:-}" ]]; then
            echo "upload_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure production dotenvx preview authority
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_DOTENV_PRIVATE_KEY: ${{ secrets.PREVIEW_DOTENV_PRIVATE_KEY }}
          PREVIEW_DOTENVX_UPLOAD_REQUIRED: ${{ steps.materialize.outputs.upload_required }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          bash scripts/upload-preview-dotenvx-keys.sh
          if [[ ! -f supabase/.env.preview ]] \
            || ! bash scripts/verify-preview-env-decryptable.sh; then
            rm -f supabase/.env.preview supabase/.env.keys
            echo "::error::PREVIEW_DOTENVX_PRODUCTION_AUTHORITY_DEFERRED" >&2
            exit 1
          fi

      - name: Resolve preview project ref
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PREVIEW_REF: ${{ inputs.preview_project_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ref="$INPUT_PREVIEW_REF"
          else
            export GITHUB_PR_HEAD_SHA="$EXPECTED_HEAD_SHA"
            ref="$(bash scripts/wait-for-current-pr-preview-ref.sh)"
          fi
          if [[ "$ref" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo "::error::Refusing to target production project ref $ref" >&2
            exit 1
          fi
          if [[ ! "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Invalid preview project ref format: $ref" >&2
            exit 1
          fi
          echo "preview_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Target preview project ref: $ref"

      - name: Wait for preview Edge Function deploy propagation
        shell: bash
        run: sleep 90

      - name: Verify preview Edge Runtime readiness probe
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
          WA_STAGE1B_PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
          WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
        run: |
          set -euo pipefail
          bash scripts/check-preview-edge-runtime-secrets-readiness.sh

name: Apply WhatsApp Runtime Patch

on:
  push:
    branches:
      - security/harden-click2api-runtime-20260802

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/harden-click2api-runtime-20260802
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/patch-whatsapp-webhook-runtime.py

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch-whatsapp-webhook-runtime.py
          rm .github/workflows/apply-whatsapp-runtime-patch.yml

      - name: Commit hardened handler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/whatsapp-webhook/index.ts scripts/patch-whatsapp-webhook-runtime.py .github/workflows/apply-whatsapp-runtime-patch.yml
          git commit -m "fix(whatsapp): authenticate Click2API callbacks before processing"
          git push origin HEAD:security/harden-click2api-runtime-20260802

name: WhatsApp Webhook Production Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the reviewed named whatsapp-webhook release'
        required: true
        default: false
        type: boolean
      release_sha:
        description: 'Exact Core main commit authorized for this production Edge deployment'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: whatsapp-webhook-production-release
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.117.0
  SUPABASE_PROJECT_REF: tcxvcatsqqertcnycuop
  FUNCTION_NAME: whatsapp-webhook
  EXPECTED_LIVE_VERSION: "167"
  EXPECTED_LIVE_BUNDLE_SHA: 8ae1f251335fe0b9fac952ec3444e858a313f2fe6d34f64cb561ca55d93c3426
  DB_PREREQ_RUN_ID: "36335058964"
  DB_PREREQ_SHA: f3366a4a99b57e20ec47a4f152af3a7b3661f5c6
  DB_PREREQ_ARTIFACT: production-migration-deployment-f3366a4a99b57e20ec47a4f152af3a7b3661f5c6

jobs:
  preflight:
    name: WhatsApp webhook production preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production-readonly
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind release to exact protected main commit
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${RELEASE_SHA_INPUT:-}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$RELEASE_SHA_INPUT"
          test "$SUPABASE_PROJECT_REF" = "tcxvcatsqqertcnycuop"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${GH_TOKEN:-}"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Re-run webhook and Edge governance
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-edge-function-governance.sh
          bash scripts/check-edge-function-auth-registry.sh
          bash scripts/check-edge-function-source-reconciliation.sh
          bash scripts/check-whatsapp-webhook-recertification.sh

      - name: Verify protected production DB prerequisite release evidence
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DB_PREREQ_RUN_ID"
          curl -fsS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "$api" -o db-prerequisite-run.json
          jq -e             --arg expected_sha "$DB_PREREQ_SHA"             '.status == "completed" and .conclusion == "success" and .head_sha == $expected_sha'             db-prerequisite-run.json >/dev/null

          curl -fsS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "$api/artifacts" -o db-prerequisite-artifacts.json
          jq -e             --arg expected_name "$DB_PREREQ_ARTIFACT"             '.artifacts | any(.name == $expected_name and .expired == false)'             db-prerequisite-artifacts.json >/dev/null

      - name: Pin current live webhook baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/$FUNCTION_NAME" \
            -o live-function-before.json
          jq -e \
            --arg fn "$FUNCTION_NAME" \
            --argjson expected_version "$EXPECTED_LIVE_VERSION" \
            --arg expected_sha "$EXPECTED_LIVE_BUNDLE_SHA" \
            '.slug == $fn and .status == "ACTIVE" and .version == $expected_version and .verify_jwt == false and .ezbr_sha256 == $expected_sha' \
            live-function-before.json >/dev/null

      - name: Upload immutable preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-webhook-production-preflight-${{ github.sha }}
          path: |
            db-prerequisite-run.json
            db-prerequisite-artifacts.json
            live-function-before.json
          retention-days: 90

  deploy:
    name: Approved named WhatsApp webhook deployment
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Re-bind write to exact approved target and unchanged live baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$RELEASE_SHA_INPUT"
          test "$SUPABASE_PROJECT_REF" = "tcxvcatsqqertcnycuop"
          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/$FUNCTION_NAME" \
            -o live-function-immediate-before.json
          jq -e \
            --arg fn "$FUNCTION_NAME" \
            --argjson expected_version "$EXPECTED_LIVE_VERSION" \
            --arg expected_sha "$EXPECTED_LIVE_BUNDLE_SHA" \
            '.slug == $fn and .status == "ACTIVE" and .version == $expected_version and .verify_jwt == false and .ezbr_sha256 == $expected_sha' \
            live-function-immediate-before.json >/dev/null

      - name: Capture and validate pre-deploy rollback evidence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/$FUNCTION_NAME/body" \
            -o whatsapp-webhook-predeploy-v167.zip
          test -s whatsapp-webhook-predeploy-v167.zip
          unzip -t whatsapp-webhook-predeploy-v167.zip >/dev/null
          rollback_zip_sha="$(sha256sum whatsapp-webhook-predeploy-v167.zip | awk '{print $1}')"
          test -n "$rollback_zip_sha"
          {
            printf 'RELEASE_SHA=%s\n' "$GITHUB_SHA"
            printf 'FUNCTION_NAME=%s\n' "$FUNCTION_NAME"
            printf 'PROJECT_REF=%s\n' "$SUPABASE_PROJECT_REF"
            printf 'PREDEPLOY_VERSION=%s\n' "$EXPECTED_LIVE_VERSION"
            printf 'PREDEPLOY_BUNDLE_SHA=%s\n' "$EXPECTED_LIVE_BUNDLE_SHA"
            printf 'ROLLBACK_ZIP_SHA256=%s\n' "$rollback_zip_sha"
          } > whatsapp-webhook-rollback-context.env
          test -s whatsapp-webhook-rollback-context.env

      - name: Require complete rollback evidence before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s live-function-immediate-before.json
          jq -e \
            --arg fn "$FUNCTION_NAME" \
            --argjson expected_version "$EXPECTED_LIVE_VERSION" \
            --arg expected_sha "$EXPECTED_LIVE_BUNDLE_SHA" \
            '.slug == $fn and .status == "ACTIVE" and .version == $expected_version and .verify_jwt == false and .ezbr_sha256 == $expected_sha' \
            live-function-immediate-before.json >/dev/null
          test -s whatsapp-webhook-predeploy-v167.zip
          unzip -t whatsapp-webhook-predeploy-v167.zip >/dev/null
          test -s whatsapp-webhook-rollback-context.env
          grep -Fxq "RELEASE_SHA=$GITHUB_SHA" whatsapp-webhook-rollback-context.env
          grep -Fxq "FUNCTION_NAME=$FUNCTION_NAME" whatsapp-webhook-rollback-context.env
          grep -Fxq "PROJECT_REF=$SUPABASE_PROJECT_REF" whatsapp-webhook-rollback-context.env
          grep -Fxq "PREDEPLOY_VERSION=$EXPECTED_LIVE_VERSION" whatsapp-webhook-rollback-context.env
          grep -Fxq "PREDEPLOY_BUNDLE_SHA=$EXPECTED_LIVE_BUNDLE_SHA" whatsapp-webhook-rollback-context.env
          recorded_zip_sha="$(awk -F= '$1 == "ROLLBACK_ZIP_SHA256" {print $2}' whatsapp-webhook-rollback-context.env)"
          test -n "$recorded_zip_sha"
          test "$(sha256sum whatsapp-webhook-predeploy-v167.zip | awk '{print $1}')" = "$recorded_zip_sha"

      - name: Upload immutable rollback evidence before deployment
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-webhook-production-rollback-${{ github.sha }}
          path: |
            live-function-immediate-before.json
            whatsapp-webhook-predeploy-v167.zip
            whatsapp-webhook-rollback-context.env
          if-no-files-found: error
          retention-days: 90

      - name: Deploy exact named function only
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy whatsapp-webhook \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt 2>&1 | tee whatsapp-webhook-deploy.txt

      - name: Verify deployed function metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/$FUNCTION_NAME" \
            -o live-function-after.json
          jq -e \
            --arg fn "$FUNCTION_NAME" \
            --argjson old_version "$EXPECTED_LIVE_VERSION" \
            '.slug == $fn and .status == "ACTIVE" and .version > $old_version and .verify_jwt == false' \
            live-function-after.json >/dev/null

      - name: Run non-customer authentication smoke checks
        shell: bash
        run: |
          set -euo pipefail
          base="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/$FUNCTION_NAME"
          challenge_code="$(curl -sS -o invalid-challenge-response.txt -w "%{http_code}" \
            "$base?challenge=release-probe&verify_token=definitely-invalid")"
          test "$challenge_code" = "403"
          post_code="$(curl -sS -o unauthenticated-post-response.txt -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" --data '{"entry":[]}' "$base")"
          test "$post_code" = "401"

      - name: Upload post-deploy verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-webhook-production-deployment-${{ github.sha }}
          path: |
            whatsapp-webhook-deploy.txt
            live-function-after.json
            invalid-challenge-response.txt
            unauthenticated-post-response.txt
          if-no-files-found: warn
          retention-days: 90

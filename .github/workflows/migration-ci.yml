name: Migration CI and Schema Drift

on:
  # Deliberately no `branches:` filter here (unlike `push:` below, which
  # stays main-only) -- a PR that stacks on another open Core PR's branch
  # (base != main) must still receive the full clean-replay/pgTAP/db-lint
  # suite, not only the static-governance job. Restricting this to
  # `branches: [main]` previously meant stacked migration PRs only ever saw
  # vendor static-analysis checks (DeepSource/Codacy/CodeRabbit) go green
  # and never a real Migration CI replay -- a false-green condition
  # discovered during the Lane 1 B1 migration-train normalization (Central
  # issue #368).
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/archived-migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'scripts/**'
      - 'docs/reconciliation/**'
      - 'docs/runbooks/WHATSAPP_DATABASE_RELEASE.md'
      - 'docs/runbooks/CONTROLLED_SUPABASE_PRODUCTION_RELEASE.md'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/archived-migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'scripts/**'
      - 'docs/reconciliation/**'
      - 'docs/runbooks/WHATSAPP_DATABASE_RELEASE.md'
      - 'docs/runbooks/CONTROLLED_SUPABASE_PRODUCTION_RELEASE.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-governance:
    name: Migration naming, safety and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        run: |
          bash -n scripts/check-migration-governance.sh
          bash -n scripts/check-canonical-authority.sh
          bash -n scripts/check-production-baseline.sh
          bash -n scripts/materialize-production-history.sh
          bash -n scripts/verify-production-migration-ledger.sh
          bash -n scripts/run-production-migration-overlay.sh
          bash -n scripts/generate-production-migration-provenance.sh
          bash -n scripts/verify-production-schema-semantic-drift.sh
          bash -n scripts/check-production-write-authority.sh
          bash -n scripts/check-production-ref-authority.sh
          bash -n scripts/check-reconciliation-ledger-freeze.sh
          bash -n scripts/check-no-open-migration-prs.sh
          bash -n scripts/tests/verify-production-migration-ledger-regression.sh
          bash -n scripts/tests/verify-production-migration-overlay.sh
          bash -n scripts/tests/verify-production-migration-provenance.sh
          bash -n scripts/tests/verify-production-schema-semantic-drift.sh
          bash -n scripts/tests/verify-step1-staging-certification-fails-closed.sh
          bash -n scripts/tests/verify-check-no-open-migration-prs.sh

      - name: Run production ledger verifier regression test
        run: bash scripts/tests/verify-production-migration-ledger-regression.sh

      - name: Run production migration provenance regression test
        run: bash scripts/tests/verify-production-migration-provenance.sh

      - name: Run production semantic schema drift regression test
        run: bash scripts/tests/verify-production-schema-semantic-drift.sh

      - name: Run open-migration-PR guard regression test
        run: bash scripts/tests/verify-check-no-open-migration-prs.sh

      - name: Run production migration overlay regression test
        run: bash scripts/tests/verify-production-migration-overlay.sh

      - name: Run step1-staging-certification fails-closed regression test
        run: bash scripts/tests/verify-step1-staging-certification-fails-closed.sh

      - name: Enforce canonical backend authority
        run: bash scripts/check-canonical-authority.sh

      - name: Enforce production-write authority (PRODUCTION MIGRATION INVARIANT)
        run: bash scripts/check-production-write-authority.sh

      - name: Enforce production project reference authority
        run: bash scripts/check-production-ref-authority.sh

      - name: Enforce migration governance
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            bash scripts/check-migration-governance.sh "origin/$BASE_REF"
            bash scripts/check-reconciliation-ledger-freeze.sh "origin/$BASE_REF"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            bash scripts/check-migration-governance.sh HEAD^
            bash scripts/check-reconciliation-ledger-freeze.sh HEAD^
          else
            bash scripts/check-migration-governance.sh
            bash scripts/check-reconciliation-ledger-freeze.sh
          fi

  clean-replay:
    name: Clean database replay and pgTAP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-governance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Start local Supabase stack (also applies every migration from zero)
        id: start
        shell: bash
        run: |
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            echo 'Supabase startup failed. This step also performs the initial'
            echo 'zero-state migration replay, so this failure can mean either a'
            echo 'Docker/image-pull bootstrap problem OR a migration SQL error.'
            echo 'The sanitized tail below distinguishes the two -- Docker/bootstrap'
            echo 'failures mention containers/images/ports; migration failures name'
            echo 'a specific migration file and a Postgres error/SQLSTATE.'
            exit 1
          fi
          echo 'Supabase local stack started.'

      - name: Print sanitized startup diagnostics
        if: failure() && steps.start.outcome == 'failure'
        shell: bash
        run: |
          echo '::group::Sanitized tail of supabase-start.log (secrets redacted)'
          tail -n 150 /tmp/supabase-start.log \
            | sed -E 's/(key|token|password|secret|jwt)[^[:space:]]*[[:space:]]*[:=][[:space:]]*[^[:space:]]+/\1=[REDACTED]/gi' \
            | tee /tmp/supabase-start-sanitized.log
          echo '::endgroup::'

      - name: Upload startup diagnostics
        if: failure() && steps.start.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-startup-diagnostics
          path: /tmp/supabase-start-sanitized.log
          if-no-files-found: error
          retention-days: 7

      - name: Replay every migration from zero
        run: supabase db reset --local

      - name: Run database contract tests
        id: db_tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/supabase-test.log

      - name: Upload database test diagnostics
        if: failure() && steps.db_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-test-diagnostics
          path: /tmp/supabase-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Run database lint
        run: supabase db lint --local --level warning

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup >/dev/null 2>&1 || true

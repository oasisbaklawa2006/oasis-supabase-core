name: Migration CI and Schema Drift

on:
  # Deliberately no `branches:` filter here (unlike `push:` below, which
  # stays main-only) -- a PR that stacks on another open Core PR's branch
  # (base != main) must still receive the full clean-replay/pgTAP/db-lint
  # suite, not only the static-governance job.
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/archived-migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'scripts/**'
      - 'docs/reconciliation/**'
      - 'docs/runbooks/WHATSAPP_DATABASE_RELEASE.md'
      - 'docs/runbooks/CONTROLLED_SUPABASE_PRODUCTION_RELEASE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.cursorrules'
      - 'APPVERSE_THREAD_GUARDRAIL.md'
      - '.github/workflows/**'
      - '.circleci/**'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/archived-migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'scripts/**'
      - 'docs/reconciliation/**'
      - 'docs/runbooks/WHATSAPP_DATABASE_RELEASE.md'
      - 'docs/runbooks/CONTROLLED_SUPABASE_PRODUCTION_RELEASE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.cursorrules'
      - 'APPVERSE_THREAD_GUARDRAIL.md'
      - '.github/workflows/**'
      - '.circleci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.110.0
  # Certified post-incident activation point. The 2026-08-31 chronology
  # incident is preserved in docs/reconciliation/MIGRATION_DISCIPLINE_REBASELINE_20260831.md.
  # Every migration introduced after this immutable commit must again form one
  # strictly increasing, append-only canonical sequence.
  MIGRATION_DISCIPLINE_BASE_SHA: 2e45e864e8e2e9b136623c9db2f2cc443a1f7af3

jobs:
  static-governance:
    name: Migration naming, safety and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        run: |
          bash -n scripts/check-migration-governance.sh
          bash -n scripts/check-migration-base-monotonicity.sh
          bash -n scripts/check-migration-history-sequence.sh
          bash -n scripts/check-canonical-authority.sh
          bash -n scripts/check-production-baseline.sh
          bash -n scripts/materialize-production-history.sh
          bash -n scripts/verify-production-migration-ledger.sh
          bash -n scripts/run-production-migration-overlay.sh
          bash -n scripts/generate-production-migration-provenance.sh
          bash -n scripts/verify-production-schema-semantic-drift.sh
          bash -n scripts/verify-local-schema-release-readiness.sh
          bash -n scripts/check-production-write-authority.sh
          bash -n scripts/check-production-ref-authority.sh
          bash -n scripts/check-reconciliation-ledger-freeze.sh
          bash -n scripts/check-no-open-migration-prs.sh
          bash -n scripts/tests/verify-production-migration-ledger-regression.sh
          bash -n scripts/tests/verify-production-migration-overlay.sh
          bash -n scripts/tests/verify-production-migration-provenance.sh
          bash -n scripts/tests/verify-production-schema-semantic-drift.sh
          bash -n scripts/tests/normalize-schema-semantic-manifest.sh
          bash -n scripts/tests/verify-check-migration-base-monotonicity.sh
          bash -n scripts/tests/verify-check-migration-history-sequence.sh
          bash -n scripts/tests/verify-step1-staging-certification-fails-closed.sh
          bash -n scripts/tests/verify-check-no-open-migration-prs.sh

      - name: Run production ledger verifier regression test
        run: bash scripts/tests/verify-production-migration-ledger-regression.sh

      - name: Run production migration provenance regression test
        run: bash scripts/tests/verify-production-migration-provenance.sh

      - name: Run production semantic schema drift regression test
        run: bash scripts/tests/verify-production-schema-semantic-drift.sh

      - name: Run semantic manifest normalizer regression test
        run: bash scripts/tests/normalize-schema-semantic-manifest.sh

      - name: Run migration target-base monotonicity regression test
        run: bash scripts/tests/verify-check-migration-base-monotonicity.sh

      - name: Run permanent migration history sequence regression test
        run: bash scripts/tests/verify-check-migration-history-sequence.sh

      - name: Run open-migration-PR guard regression test
        run: bash scripts/tests/verify-check-no-open-migration-prs.sh

      - name: Run production migration overlay regression test
        run: bash scripts/tests/verify-production-migration-overlay.sh

      - name: Run step1-staging-certification fails-closed regression test
        run: bash scripts/tests/verify-step1-staging-certification-fails-closed.sh

      - name: Enforce canonical backend authority
        run: bash scripts/check-canonical-authority.sh

      - name: Enforce production-write authority (PRODUCTION MIGRATION INVARIANT)
        run: bash scripts/check-production-write-authority.sh

      - name: Enforce production project reference authority
        run: bash scripts/check-production-ref-authority.sh

      - name: Enforce migration governance and chronology
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            bash scripts/check-migration-base-monotonicity.sh "origin/$BASE_REF"
            bash scripts/check-migration-governance.sh "origin/$BASE_REF"
            bash scripts/check-reconciliation-ledger-freeze.sh "origin/$BASE_REF"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]] || ! git rev-parse --verify "${PUSH_BEFORE}^{commit}" >/dev/null 2>&1; then
              echo "Migration governance cannot resolve the complete push base: '${PUSH_BEFORE:-missing}'" >&2
              exit 1
            fi
            bash scripts/check-migration-base-monotonicity.sh "$PUSH_BEFORE"
            bash scripts/check-migration-governance.sh "$PUSH_BEFORE"
            bash scripts/check-reconciliation-ledger-freeze.sh "$PUSH_BEFORE"
            bash scripts/check-migration-history-sequence.sh "$MIGRATION_DISCIPLINE_BASE_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bash scripts/check-migration-base-monotonicity.sh "$MIGRATION_DISCIPLINE_BASE_SHA"
            bash scripts/check-migration-governance.sh "$MIGRATION_DISCIPLINE_BASE_SHA"
            bash scripts/check-reconciliation-ledger-freeze.sh "$MIGRATION_DISCIPLINE_BASE_SHA"
            bash scripts/check-migration-history-sequence.sh "$MIGRATION_DISCIPLINE_BASE_SHA"
          else
            echo "Unsupported migration-governance event: $EVENT_NAME" >&2
            exit 1
          fi

  clean-replay:
    name: Clean database replay and pgTAP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-governance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Supabase CLI
        # Exact commit used by the certified production migration tooling.
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Run canonical local schema release readiness
        id: readiness
        shell: bash
        run: bash scripts/verify-local-schema-release-readiness.sh

      - name: Upload local release-readiness diagnostics
        if: failure() && steps.readiness.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: local-schema-release-readiness-diagnostics
          path: |
            /tmp/supabase-start-sanitized.log
            /tmp/canonical-schema-semantic.manifest
            /tmp/supabase-test.log
            /tmp/supabase-lint.log
          if-no-files-found: warn
          retention-days: 7

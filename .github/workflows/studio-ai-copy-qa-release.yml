name: Studio AI Copy QA Deploy and Delete

# Owner-accepted QA-only token/writer risk. No Production deployment.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy inert Studio AI Copy to QA, or delete after UAT
        type: choice
        required: true
        options: [deploy, delete]
        default: deploy

permissions:
  contents: read

concurrency:
  group: oasis-genie-qa-studio-copy
  cancel-in-progress: false

jobs:
  qa-function:
    name: Studio QA named-function deploy or delete
    if: github.repository == 'oasisbaklawa2006/oasis-supabase-core' && github.ref == 'refs/heads/main'
    environment: genie-qa-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QA_PROJECT_REF: skhpmltfjgqitntkmclb
      QA_FUNCTION_NAME: catalogue-ai-copy
      QA_OPERATION: ${{ inputs.operation }}
      AI_STUDIO_AI_ENABLED: "false"
      CLI_VERSION: "2.117.0"
    steps:
      - name: Verify fixed QA project and protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = oasisbaklawa2006/oasis-supabase-core
          test "$GITHUB_REF" = refs/heads/main
          test "$QA_PROJECT_REF" = skhpmltfjgqitntkmclb
          test "$QA_FUNCTION_NAME" = catalogue-ai-copy
          test "$AI_STUDIO_AI_ENABLED" = false
          [[ "$QA_OPERATION" =~ ^(deploy|delete)$ ]]
      - name: Checkout immutable reviewed main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Render pinned provider-inert QA source and run negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ruby scripts/studio-qa/verify_release_hold.rb
          ruby scripts/tests/test_studio_qa_release_hold.rb
          python3 -I -m unittest discover -s scripts/tests -p 'test_studio_qa_ai_copy.py' -q
          mkdir -p "$RUNNER_TEMP/studio-qa/supabase/functions"
          python3 -I scripts/studio-qa/build_inert_copy.py \
            --source supabase/functions/catalogue-ai-copy/index.ts \
            --helper supabase/functions/_shared/catalogueAiCopy.ts \
            --output-dir "$RUNNER_TEMP/studio-qa/supabase/functions"
          python3 scripts/edge-function-source-manifest.py \
            "$RUNNER_TEMP/studio-qa/supabase/functions" catalogue-ai-copy \
            --output "$RUNNER_TEMP/studio-qa-source-manifest.json"
          jq -e '.function == "catalogue-ai-copy" and .fileCount == 2' \
            "$RUNNER_TEMP/studio-qa-source-manifest.json" >/dev/null
          printf 'project_id = "skhpmltfjgqitntkmclb"\n[functions.catalogue-ai-copy]\nverify_jwt = true\n' \
            > "$RUNNER_TEMP/studio-qa/supabase/config.toml"
          ! grep -RE 'OPENAI_API_KEY|api[.]openai[.]com|AI_STUDIO_AI_ENABLED|fetch[(]' \
            "$RUNNER_TEMP/studio-qa/supabase/functions"
          echo STUDIO_QA_INERT_JWT_TRUE_VERIFIED
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.CLI_VERSION }}
      - name: Deploy or delete only the QA catalogue-ai-copy function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STUDIO_QA_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$QA_PROJECT_REF" = skhpmltfjgqitntkmclb
          test "$QA_FUNCTION_NAME" = catalogue-ai-copy
          test "$AI_STUDIO_AI_ENABLED" = false
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$QA_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/studio-qa-before.json"
          jq -e 'type=="array" and (length==0 or
                 (length==1 and .[0].slug=="catalogue-ai-copy"))' \
            "$RUNNER_TEMP/studio-qa-before.json" >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$QA_OPERATION" == deploy ]]; then
            # Force zero paid AI spend on QA; no provider code is in the source.
            supabase secrets set --project-ref "$QA_PROJECT_REF" AI_STUDIO_AI_ENABLED=false
            cd "$RUNNER_TEMP/studio-qa"
            supabase functions deploy "$QA_FUNCTION_NAME" --project-ref "$QA_PROJECT_REF" --use-api
          else
            # Named-function deletion only. Never delete any project or other function.
            if jq -e 'length == 1' "$RUNNER_TEMP/studio-qa-before.json" >/dev/null; then
              supabase functions delete "$QA_FUNCTION_NAME" --project-ref "$QA_PROJECT_REF"
            fi
            supabase secrets unset --project-ref "$QA_PROJECT_REF" AI_STUDIO_AI_ENABLED
          fi
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$QA_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/studio-qa-after.json"
          if [[ "$QA_OPERATION" == deploy ]]; then
            jq -e 'type=="array" and length==1 and .[0].slug=="catalogue-ai-copy" and
                   .[0].status=="ACTIVE" and .[0].verify_jwt==true' \
              "$RUNNER_TEMP/studio-qa-after.json" >/dev/null
            echo 'QA INERT DEPLOYED: JWT=true, OpenAI provider removed, AI_STUDIO_AI_ENABLED=false' >> "$GITHUB_STEP_SUMMARY"
            echo 'After QA UAT, dispatch this workflow with operation=delete.' >> "$GITHUB_STEP_SUMMARY"
          else
            jq -e 'type=="array" and length==0' "$RUNNER_TEMP/studio-qa-after.json" >/dev/null
            echo 'QA CLEANUP CONFIRMED: no deployed Edge Functions.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Owner: revoke STUDIO_QA_DEPLOY_TOKEN after UAT/rollback.' >> "$GITHUB_STEP_SUMMARY"
          fi

name: Temporary Supabase migration filename

on:
  push:
    branches:
      - backend/buyer-full-feel-20261006

permissions:
  contents: read

jobs:
  migration-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create migration filename with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx supabase@latest migration new buyer_full_feel_backend_projections
          find supabase/migrations -maxdepth 1 -type f -name '*_buyer_full_feel_backend_projections.sql' -printf '%f\n'

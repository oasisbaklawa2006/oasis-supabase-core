name: WhatsApp Webhook Security

on:
  pull_request:
    paths:
      - 'supabase/functions/whatsapp-webhook/**'
      - 'supabase/functions/_shared/whatsappWebhookSecurity.ts'
      - 'supabase/functions/_shared/whatsappWebhookSecurity.test.ts'
      - 'supabase/functions/_shared/whatsappWebhookBoundary.ts'
      - 'supabase/functions/_shared/wa-governance/resolveWebhookCompany.ts'
      - 'supabase/functions/_shared/wa-governance/resolveWebhookCompany.test.ts'
      - '.github/workflows/sync-whatsapp-edge-secrets.yml'
      - '.github/workflows/whatsapp-webhook-security.yml'
      - 'docs/security/WHATSAPP_WEBHOOK_RUNTIME_EVIDENCE_2026-07-31.md'
      - 'docs/security/WHATSAPP_CLICK2API_RUNTIME_EVIDENCE_2026-08-01.md'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/whatsapp-webhook/**'
      - 'supabase/functions/_shared/whatsappWebhookSecurity.ts'
      - 'supabase/functions/_shared/whatsappWebhookSecurity.test.ts'
      - 'supabase/functions/_shared/whatsappWebhookBoundary.ts'
      - 'supabase/functions/_shared/wa-governance/resolveWebhookCompany.ts'
      - 'supabase/functions/_shared/wa-governance/resolveWebhookCompany.test.ts'
      - '.github/workflows/sync-whatsapp-edge-secrets.yml'
      - '.github/workflows/whatsapp-webhook-security.yml'

permissions:
  contents: read

jobs:
  verification-primitives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check security boundary
        run: deno check supabase/functions/_shared/whatsappWebhookSecurity.ts supabase/functions/_shared/whatsappWebhookBoundary.ts supabase/functions/_shared/wa-governance/resolveWebhookCompany.ts
      - name: Run executable webhook boundary tests
        run: deno test --allow-read supabase/functions/_shared/whatsappWebhookSecurity.test.ts supabase/functions/_shared/whatsappWebhookBoundary.test.ts supabase/functions/_shared/wa-governance/resolveWebhookCompany.test.ts
      - name: Reject secret values in workflow output paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'echo .*(WHATSAPP_(API_KEY|ACCESS_TOKEN|WEBHOOK_VERIFY_TOKEN|APP_SECRET))' .github/workflows/sync-whatsapp-edge-secrets.yml

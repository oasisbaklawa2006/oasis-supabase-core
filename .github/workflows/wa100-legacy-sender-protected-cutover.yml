name: WA-100 Legacy Sender Protected Cutover

# Manual dispatch only. This workflow binds protected production environments and must never
# run on any pull-request-style or workflow-run event. The credential-free PR
# contract lives in wa100-legacy-sender-pr-contract.yml (see Core PR guard:
# scripts/check-preview-edge-runtime-secrets-config.sh).

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact reviewed Core main SHA; never a branch or stale commit"
        required: true
        type: string
      deploy:
        description: "Deploy only after independent production approval (false = preflight)"
        required: true
        type: boolean
        default: false
      caller_idempotency_certified:
        description: "Owner-approved Central manual/automation caller idempotency and consent cutover"
        required: true
        type: boolean
        default: false
      provider_contract_certified:
        description: "Provider CRM auth, consent/template and queue-to-wamid acceptance reviewed"
        required: true
        type: boolean
        default: false
      rollback_approved:
        description: "Owner-approved rollback that never silently re-enables unsafe v143"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: wa100-legacy-sender-protected-cutover
  cancel-in-progress: false

env:
  PROJECT_REF: tcxvcatsqqertcnycuop
  FUNCTION_NAME: send-whatsapp
  EXPECTED_LIVE_VERSION: "143"
  EXPECTED_LIVE_BUNDLE_SHA: 8146d49a3711ca10e32c9f6979ea24bab497974e36f51417034863539d942ac9
  CLI_VERSION: 2.117.0

jobs:
  contract:
    name: Credential-free legacy sender default-off contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x
          cache: true
      - name: Format, lint, test and typecheck the reviewed default-off candidate
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check supabase/functions/send-whatsapp/index.ts supabase/functions/send-whatsapp/index.test.ts supabase/functions/_shared/requireInternalStaff.ts supabase/functions/_shared/requireInternalStaff.test.ts
          deno lint supabase/functions/send-whatsapp/index.ts supabase/functions/send-whatsapp/index.test.ts supabase/functions/_shared/requireInternalStaff.ts supabase/functions/_shared/requireInternalStaff.test.ts
          deno test --allow-env --allow-net --allow-read supabase/functions/send-whatsapp/index.test.ts supabase/functions/_shared/requireInternalStaff.test.ts
          deno check supabase/functions/send-whatsapp/index.ts
      - name: Reject unsafe sender, accidental enablement or broad Preview configuration
        shell: bash
        run: |
          set -euo pipefail
          src="supabase/functions/$FUNCTION_NAME/index.ts"
          test -s "$src"
          grep -Fq 'WA100_LEGACY_SENDER_SEND_ENABLED' "$src"
          grep -Fq 'WA100_SENDER_RELEASE_NOT_AUTHORIZED' "$src"
          grep -Fq 'requireInternalStaff' "$src"
          if grep -Eq 'sendViaMSG91|sendWithFallback|MSG91_AUTH_KEY|MSG91_WHATSAPP_ENDPOINT' "$src"; then
            echo "::error::Legacy sender may not retry or cross providers"
            exit 1
          fi
          if grep -Eq 'status: result.success.*delivered|outcome: result.success.*delivered' "$src"; then
            echo "::error::Provider acceptance is not DELIVERED"
            exit 1
          fi
          if grep -Fxq '[functions.send-whatsapp]' supabase/config.toml; then
            echo "::error::Function entered broad Preview deployment config"
            exit 1
          fi

  preflight:
    name: Protected legacy sender live baseline and recovery archive
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    environment: supabase-production-readonly
    timeout-minutes: 25
    outputs:
      preflight_artifact_id: ${{ steps.archive_preflight.outputs.artifact-id }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOY_REQUESTED: ${{ inputs.deploy }}
      CALLER_CERTIFIED: ${{ inputs.caller_idempotency_certified }}
      ROLLBACK_CERTIFIED: ${{ inputs.rollback_approved }}
      PROVIDER_CERTIFIED: ${{ inputs.provider_contract_certified }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current protected main, correct project, and owner cutover evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch -q origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$RELEASE_SHA"
          test "$PROJECT_REF" = "tcxvcatsqqertcnycuop"
          test -n "$SUPABASE_ACCESS_TOKEN"
          if [[ "$DEPLOY_REQUESTED" == "true" ]]; then
            test "$CALLER_CERTIFIED" = "true" || { echo "::error::Durable caller idempotency signoff missing"; exit 1; }
            test "$ROLLBACK_CERTIFIED" = "true" || { echo "::error::Safe recovery signoff missing"; exit 1; }
            test "$PROVIDER_CERTIFIED" = "true" || { echo "::error::Provider contract signoff missing"; exit 1; }
          fi
          test -s "supabase/functions/$FUNCTION_NAME/index.ts"
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.CLI_VERSION }}
      - name: Fail closed if legacy sender release switch already exists in production
        shell: bash
        run: |
          set -euo pipefail
          # Presence only: never log or download any stored secret value.
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" |
            jq -e 'type == "array" and all(.[]; .name != "WA100_LEGACY_SENDER_SEND_ENABLED")' >/dev/null || {
              echo "::error::Legacy sender flag is set or secret inventory unavailable: STOP"
              exit 1
            }
      - name: Freeze exact live version, source, and reversible evidence before release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$FUNCTION_NAME" > live-before.json
          jq -e --arg n "$FUNCTION_NAME" --argjson v "$EXPECTED_LIVE_VERSION" --arg sha "$EXPECTED_LIVE_BUNDLE_SHA" \
            '.slug == $n and .status == "ACTIVE" and .version == $v and .verify_jwt == true and .ezbr_sha256 == $sha' \
            live-before.json > /dev/null
          mkdir -p prior-source
          (cd prior-source && supabase --workdir "$PWD" functions download "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --use-api)
          test -s "prior-source/supabase/functions/$FUNCTION_NAME/index.ts"
          test "$(find "prior-source/supabase/functions/$FUNCTION_NAME" -type f | wc -l)" -ge 1
          tar -czf live-v143-source.tar.gz -C prior-source supabase
          sha256sum live-v143-source.tar.gz > prior-source-sha256.txt
          sha256sum "supabase/functions/$FUNCTION_NAME/index.ts" "supabase/functions/_shared/requireInternalStaff.ts" > candidate-source-sha256.txt
          jq '{slug,version,status,verify_jwt,ezbr_sha256}' live-before.json > live-before-sanitized.json
      - name: Keep captured source and hashes inside access-controlled GitHub evidence
        id: archive_preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wa100-legacy-sender-preflight-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: |
            live-v143-source.tar.gz
            prior-source-sha256.txt
            candidate-source-sha256.txt
            live-before-sanitized.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Independently approved legacy sender default-off deployment
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.caller_idempotency_certified == true && inputs.provider_contract_certified == true && inputs.rollback_approved == true
    needs: preflight
    runs-on: ubuntu-24.04
    environment: supabase-production
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable successful preflight artifact ID
        shell: bash
        env:
          PREFLIGHT_ARTIFACT_ID: ${{ needs.preflight.outputs.preflight_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Missing or invalid preflight artifact ID; cannot deploy"
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.preflight.outputs.preflight_artifact_id }}
          path: preflight
          merge-multiple: true
      - name: Recheck approved source, rollback archive, project and unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch -q origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$RELEASE_SHA"
          test "$PROJECT_REF" = "tcxvcatsqqertcnycuop"
          test -n "$SUPABASE_ACCESS_TOKEN"
          (cd preflight && sha256sum -c prior-source-sha256.txt)
          sha256sum -c preflight/candidate-source-sha256.txt
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$FUNCTION_NAME" > live-immediate-before.json
          jq -e --arg n "$FUNCTION_NAME" --argjson v "$EXPECTED_LIVE_VERSION" --arg sha "$EXPECTED_LIVE_BUNDLE_SHA" \
            '.slug == $n and .status == "ACTIVE" and .version == $v and .verify_jwt == true and .ezbr_sha256 == $sha' \
            live-immediate-before.json > /dev/null
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.CLI_VERSION }}
      - name: Revalidate production sender switch is absent before any deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" |
            jq -e 'type == "array" and all(.[]; .name != "WA100_LEGACY_SENDER_SEND_ENABLED")' >/dev/null || {
              echo "::error::Legacy sender default-off assurance lost: STOP"
              exit 1
            }
      - name: Deploy only approved send-whatsapp while retaining verify_jwt=true
        shell: bash
        run: |
          set -euo pipefail
          # Candidate fails closed with HTTP 503 until a separate send-enable release.
          # Never set WA100_LEGACY_SENDER_SEND_ENABLED in this workflow.
          supabase functions deploy send-whatsapp \
            --project-ref "$PROJECT_REF" --use-api
      - name: Verify greater version, same JWT posture and identical deployed source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$FUNCTION_NAME" > live-after.json
          jq -e --arg n "$FUNCTION_NAME" --argjson prior "$EXPECTED_LIVE_VERSION" \
            '.slug == $n and .status == "ACTIVE" and .version > $prior and .verify_jwt == true' \
            live-after.json > /dev/null
          mkdir -p deployed-source
          (cd deployed-source && supabase --workdir "$PWD" functions download "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --use-api)
          cmp -s "supabase/functions/$FUNCTION_NAME/index.ts" \
            "deployed-source/supabase/functions/$FUNCTION_NAME/index.ts"
          jq '{slug,version,status,verify_jwt,ezbr_sha256}' live-after.json > live-after-sanitized.json
      - name: Verify anonymous and invalid authentication cannot send messages
        shell: bash
        run: |
          set -euo pipefail
          target="https://$PROJECT_REF.supabase.co/functions/v1/$FUNCTION_NAME"
          code="$(curl -sS -o unauth-result.txt -w '%{http_code}' -X POST \
            -H 'content-type: application/json' --data '{}' "$target")"
          test "$code" = "401"
          code="$(curl -sS -o invalid-jwt-result.txt -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -H 'authorization: Bearer invalid-token' \
            --data '{}' "$target")"
          test "$code" = "401"
      - name: Upload non-secret release result for independent inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wa100-legacy-sender-release-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: |
            live-after-sanitized.json
          retention-days: 30

name: Genie QA real MSG91 provider protected release
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact protected Core main SHA
        required: true
        type: string
      mode:
        description: Preflight or deploy both disabled QA bundles
        type: choice
        options: [preflight, deploy]
        default: preflight
      change_reference:
        description: Core#495/Buyer#64;QA-EDGE-APPROVAL=<owner change reference>
        required: true
        type: string
      authorization:
        description: Deploy only - AUTHORIZE-GENIE-QA-REAL-PROVIDER-BUNDLES
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: genie-qa-msg91-edge-commission
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: |
          bash -n scripts/genie-qa/release_msg91_real_provider.sh
          python3 -m unittest discover -s scripts/tests -p test_genie_qa_real_provider_release.py -v
          node --test scripts/tests/test_genie_qa_msg91_provider_candidate.mjs supabase/tests/msg91_legacy_modes_guard.test.mjs supabase/tests/msg91_identity_flow.test.mjs supabase/tests/msg91_provider_and_wiring.test.mjs
  release:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'oasisbaklawa2006/oasis-supabase-core' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-24.04
    # Must be owner-verified protected, main-only, independent reviewer before dispatch.
    environment: genie-qa-bootstrap
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_head_sha }}
      QA_MODE: ${{ inputs.mode }}
      QA_CHANGE_REFERENCE: ${{ inputs.change_reference }}
      QA_APPROVAL: ${{ inputs.authorization }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0
      - name: Capture exact QA rollback and stage disabled candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.GENIE_QA_MSG91_MANAGEMENT_TOKEN }}
          QA_DATABASE_URL: ${{ secrets.GENIE_QA_DATABASE_URL }}
          QA_CA_CERT_PEM: ${{ secrets.GENIE_QA_CA_CERT_PEM }}
        run: bash scripts/genie-qa/release_msg91_real_provider.sh capture
      - name: Upload checksum-verified QA rollback before any deploy
        id: rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genie-qa-msg91-rollback-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/genie-qa-real-provider/evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Owner-approved deployment of two disabled QA bundles
        if: inputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.GENIE_QA_MSG91_MANAGEMENT_TOKEN }}
          QA_DATABASE_URL: ${{ secrets.GENIE_QA_DATABASE_URL }}
          QA_CA_CERT_PEM: ${{ secrets.GENIE_QA_CA_CERT_PEM }}
          ROLLBACK_ARTIFACT_ID: ${{ steps.rollback.outputs.artifact-id }}
        run: bash scripts/genie-qa/release_msg91_real_provider.sh deploy
      - name: Upload sanitized deployed source evidence
        if: inputs.mode == 'deploy' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genie-qa-msg91-disabled-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/genie-qa-real-provider/post-evidence/
          if-no-files-found: error
          retention-days: 30

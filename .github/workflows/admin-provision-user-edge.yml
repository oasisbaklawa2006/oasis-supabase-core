name: Admin Provision User Edge contract

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/admin-provision-user/**"
      - "supabase/functions/_shared/adminProvisionUser.ts"
      - "supabase/functions/_shared/adminProvisionUser.test.ts"
      - "supabase/config.toml"
      - "scripts/check-admin-provision-user-production-first-deploy.sh"
      - "scripts/tests/verify-check-admin-provision-user-production-first-deploy.sh"
      - "scripts/sql/verify-admin-provision-user-production-db-prerequisites.sql"
      - ".github/workflows/admin-provision-user-edge.yml"
      - ".github/workflows/admin-provision-user-production-first-deploy.yml"
      - ".github/workflows/admin-provision-user-production-remove.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x
          cache: true
      - name: Format check
        run: >-
          deno fmt --check
          supabase/functions/_shared/adminProvisionUser.ts
          supabase/functions/_shared/adminProvisionUser.test.ts
          supabase/functions/admin-provision-user/index.ts
      - name: Lint
        run: >-
          deno lint
          supabase/functions/_shared/adminProvisionUser.ts
          supabase/functions/_shared/adminProvisionUser.test.ts
          supabase/functions/admin-provision-user/index.ts
      - name: Contract tests
        run: deno test supabase/functions/_shared/adminProvisionUser.test.ts
      - name: Edge type check
        run: deno check supabase/functions/admin-provision-user/index.ts

name: WA-100 Legacy Sender Single-Attempt Safety

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/send-whatsapp/**"
      - ".github/workflows/wa100-legacy-sender-protected-cutover.yml"
      - "supabase/functions/_shared/requireInternalStaff.ts"
      - "supabase/functions/_shared/requireInternalStaff.test.ts"
      - "supabase/functions/_shared/whatsappProviderAcceptance.ts"
      - "supabase/config.toml"
      - ".github/workflows/wa100-legacy-send-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-compatibility-contract:
    name: Legacy sender fail-closed contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Forbid multi-provider retries and unauthorized broad preview deploy
        shell: bash
        run: |
          set -euo pipefail
          src=supabase/functions/send-whatsapp/index.ts
          test -s "$src"
          test -s supabase/functions/send-whatsapp/index.test.ts
          if grep -Eq 'sendViaMSG91|sendWithFallback|MSG91_AUTH_KEY|MSG91_WHATSAPP_ENDPOINT' "$src"; then
            echo "::error::Legacy WhatsApp sender must not retry or cross providers"
            exit 1
          fi
          python3 - <<'PY'
          import pathlib
          import re
          source = pathlib.Path("supabase/functions/send-whatsapp/index.ts").read_text()
          forbidden = re.compile(r'''\b(?:status|outcome)\s*:\s*result\.success\s*\?\s*["']delivered["']''')
          # Positive control uses the sender's multiline ternary layout.
          control = 'status: result.success\n ? "delivered"\n : "pending"'
          if not forbidden.search(control):
              raise SystemExit("Guard must reject multiline delivered assignments")
          if forbidden.search(source):
              raise SystemExit("Provider acceptance is not delivery proof")
          PY
          if grep -Fxq '[functions.send-whatsapp]' supabase/config.toml; then
            echo "::error::Candidate function must not enter unrestricted preview deploy config"
            exit 1
          fi
      - name: Enforce manual-only production sender cutover boundary
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/wa100-legacy-sender-protected-cutover.yml
          test -s "$wf"
          grep -Fq '  workflow_dispatch:' "$wf"
          if ! awk '/^on:$/ { event_block=1; next } event_block && /^[^[:space:]]/ { exit } event_block && /^  [a-z_]+:/ && $0 != "  workflow_dispatch:" { bad=1 } END { exit bad }' "$wf"; then
            echo "::error::Production workflow may ONLY be workflow_dispatch"
            exit 1
          fi
          grep -Fq 'environment: supabase-production-readonly' "$wf"
          grep -Fq 'environment: supabase-production' "$wf"
          grep -Fq 'EXPECTED_LIVE_VERSION: "143"' "$wf"
          grep -Fq '8146d49a3711ca10e32c9f6979ea24bab497974e36f51417034863539d942ac9' "$wf"
          grep -Fq 'WA100_LEGACY_SENDER_SEND_ENABLED' "$wf"
          grep -Fq 'inputs.provider_contract_certified == true' "$wf"
          grep -Fq 'inputs.caller_idempotency_certified == true' "$wf"
          grep -Fq 'inputs.rollback_approved == true' "$wf"
          grep -Fq '.verify_jwt == true' "$wf"
      - name: Regression-test default-off secret inventory gate against safe and unsafe JSON
        shell: bash
        run: |
          set -euo pipefail
          selector='type == "array" and all(.[]; .name != "WA100_LEGACY_SENDER_SEND_ENABLED")'
          printf '%s\n' '[{"name":"UNRELATED"}]' | jq -e "$selector" >/dev/null
          if printf '%s\n' '[{"name":"WA100_LEGACY_SENDER_SEND_ENABLED"}]' | jq -e "$selector" >/dev/null; then
            echo "::error::Sender switch present must block preflight"
            exit 1
          fi
          if printf '%s\n' '{"error":"not_authorized"}' | jq -e "$selector" >/dev/null; then
            echo "::error::Unexpected secret inventory schema must block preflight"
            exit 1
          fi
          if printf '%s\n' '[]' | jq -e "$selector" >/dev/null; then
            :
          else
            echo "::error::Empty inventory should remain safely default-off"
            exit 1
          fi
      - uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x
          cache: true
      - name: Format source and test
        run: >-
          deno fmt --check
          supabase/functions/send-whatsapp/index.ts
          supabase/functions/send-whatsapp/index.test.ts
          supabase/functions/_shared/requireInternalStaff.test.ts
          supabase/functions/_shared/requireInternalStaff.ts
      - name: Lint source and test
        run: >-
          deno lint
          supabase/functions/send-whatsapp/index.ts
          supabase/functions/send-whatsapp/index.test.ts
          supabase/functions/_shared/requireInternalStaff.ts
          supabase/functions/_shared/requireInternalStaff.test.ts
      - name: Provider-mock and authorization negative tests
        run: >-
          deno test --allow-env --allow-net --allow-read
          supabase/functions/send-whatsapp/index.test.ts
          supabase/functions/_shared/requireInternalStaff.test.ts
      - name: Typecheck source
        run: deno check supabase/functions/send-whatsapp/index.ts

name: Admin Provision User Protected Update

# Manual dispatch only. This workflow binds protected production environments and must never
# run through pull-request or workflow-run triggers. The credential-free PR
# contract runs without credentials and independent production approval is required.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact reviewed Core main SHA; never a branch or stale commit"
        required: true
        type: string
      deploy:
        description: "Deploy only after independent production approval (false = preflight)"
        required: true
        type: boolean
        default: false
      staff_caller_certified:
        description: "Staff invitation caller and privilege/role granting reviewed"
        required: true
        type: boolean
        default: false
      redirect_allowlisted:
        description: "Supabase Auth allowlist includes approved staff first-password callback"
        required: true
        type: boolean
        default: false
      email_config_certified:
        description: "SMTP provider and invitation template verified for official sender"
        required: true
        type: boolean
        default: false
      rollback_approved:
        description: "Owner approved recovery from source-attested v5 archive"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: admin-provision-user-protected-update
  cancel-in-progress: false

env:
  PROJECT_REF: tcxvcatsqqertcnycuop
  FUNCTION_NAME: admin-provision-user
  EXPECTED_LIVE_VERSION: "5"
  EXPECTED_LIVE_BUNDLE_SHA: 7bb177f6a3e4d6cd429be0b64d76ba9ec36492d686e359bba4c0c4c6e957ad84
  CLI_VERSION: 2.117.0

jobs:
  contract:
    name: Credential-free governed employee invitation source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x
          cache: true
      - name: Format, lint, test and typecheck the governed invitation source
        shell: bash
        run: |
          set -euo pipefail
          src=supabase/functions/admin-provision-user/index.ts
          helper=supabase/functions/_shared/adminProvisionUser.ts
          test -s "$src" && test -s "$helper"
          deno fmt --check "$src" "$helper" supabase/functions/_shared/adminProvisionUser.test.ts
          deno lint "$src" "$helper" supabase/functions/_shared/adminProvisionUser.test.ts
          deno test supabase/functions/_shared/adminProvisionUser.test.ts
          deno check "$src"
          grep -Fq 'staffInviteRedirect' "$src"
          grep -Fq 'inviteUserByEmail' "$src"
          grep -Fq 'can_grant_staff_role' "$src"
          grep -Fq 'grant_staff_role' "$src"
          grep -Fq '/reset-password?invite=1' "$helper"
          if grep -Fxq '[functions.admin-provision-user]' supabase/config.toml; then
            echo "::error::Staff provisioning may not enter broad Preview deployment config"
            exit 1
          fi

  preflight:
    name: Protected staff provisioner live baseline and recovery archive
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    environment: supabase-production-readonly
    timeout-minutes: 25
    outputs:
      preflight_artifact_id: ${{ steps.archive_preflight.outputs.artifact-id }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOY_REQUESTED: ${{ inputs.deploy }}
      STAFF_CALLER_CERTIFIED: ${{ inputs.staff_caller_certified }}
      ROLLBACK_CERTIFIED: ${{ inputs.rollback_approved }}
      EMAIL_CONFIG_CERTIFIED: ${{ inputs.email_config_certified }}
      REDIRECT_CERTIFIED: ${{ inputs.redirect_allowlisted }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current protected main, correct project, and owner cutover evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch -q origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$RELEASE_SHA"
          test "$PROJECT_REF" = "tcxvcatsqqertcnycuop"
          test -n "$SUPABASE_ACCESS_TOKEN"
          if [[ "$DEPLOY_REQUESTED" == "true" ]]; then
            test "$STAFF_CALLER_CERTIFIED" = "true" || { echo "::error::Durable caller idempotency signoff missing"; exit 1; }
            test "$ROLLBACK_CERTIFIED" = "true" || { echo "::error::Reviewed rollback archive approval missing"; exit 1; }
            test "$REDIRECT_CERTIFIED" = "true" || { echo "::error::Redirect allowlist signoff missing"; exit 1; }
            test "$EMAIL_CONFIG_CERTIFIED" = "true" || { echo "::error::SMTP/template signoff missing"; exit 1; }
          fi
          test -s "supabase/functions/$FUNCTION_NAME/index.ts"
          test -s "supabase/functions/_shared/adminProvisionUser.ts"
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.CLI_VERSION }}
      - name: Require configured trusted staff invite origin (presence only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" |
            jq -e 'type == "array" and all(.[]; (type == "object") and (.name | type == "string")) and any(.[]; .name == "ADMIN_PROVISION_ALLOWED_ORIGIN")' >/dev/null || {
              echo "::error::Trusted invite origin secret not configured or inventory inaccessible"
              exit 1
            }
      - name: Freeze exact live version, source, and reversible evidence before release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$FUNCTION_NAME" > live-before.json
          jq -e --arg n "$FUNCTION_NAME" --argjson v "$EXPECTED_LIVE_VERSION" --arg sha "$EXPECTED_LIVE_BUNDLE_SHA" \
            '.slug == $n and .status == "ACTIVE" and .version == $v and .verify_jwt == true and .ezbr_sha256 == $sha' \
            live-before.json > /dev/null
          mkdir -p prior-source
          (cd prior-source && supabase --workdir "$PWD" functions download "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --use-api)
          test -s "prior-source/supabase/functions/$FUNCTION_NAME/index.ts"
          test -s "prior-source/supabase/functions/_shared/adminProvisionUser.ts"
          test "$(find "prior-source/supabase/functions/$FUNCTION_NAME" -type f | wc -l)" -ge 1
          tar -czf live-v5-source.tar.gz -C prior-source supabase
          sha256sum live-v5-source.tar.gz > prior-source-sha256.txt
          sha256sum "supabase/functions/$FUNCTION_NAME/index.ts" "supabase/functions/_shared/adminProvisionUser.ts" > candidate-source-sha256.txt
          jq '{slug,version,status,verify_jwt,ezbr_sha256}' live-before.json > live-before-sanitized.json
      - name: Keep captured source and hashes inside access-controlled GitHub evidence
        id: archive_preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-provision-update-preflight-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: |
            live-v5-source.tar.gz
            prior-source-sha256.txt
            candidate-source-sha256.txt
            live-before-sanitized.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Independently approved staff provisioner protected update
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.staff_caller_certified == true && inputs.redirect_allowlisted == true && inputs.email_config_certified == true && inputs.rollback_approved == true
    needs: preflight
    runs-on: ubuntu-24.04
    environment: supabase-production
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable successful preflight artifact ID
        shell: bash
        env:
          PREFLIGHT_ARTIFACT_ID: ${{ needs.preflight.outputs.preflight_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Missing or invalid preflight artifact ID; cannot deploy"
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.preflight.outputs.preflight_artifact_id }}
          path: preflight
          merge-multiple: true
      - name: Recheck approved source, rollback archive, project and unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch -q origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$RELEASE_SHA"
          test "$PROJECT_REF" = "tcxvcatsqqertcnycuop"
          test -n "$SUPABASE_ACCESS_TOKEN"
          (cd preflight && sha256sum -c prior-source-sha256.txt)
          sha256sum -c preflight/candidate-source-sha256.txt
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$FUNCTION_NAME" > live-immediate-before.json
          jq -e --arg n "$FUNCTION_NAME" --argjson v "$EXPECTED_LIVE_VERSION" --arg sha "$EXPECTED_LIVE_BUNDLE_SHA" \
            '.slug == $n and .status == "ACTIVE" and .version == $v and .verify_jwt == true and .ezbr_sha256 == $sha' \
            live-immediate-before.json > /dev/null
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.CLI_VERSION }}
      - name: Revalidate staff invite origin configuration before deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" |
            jq -e 'type == "array" and all(.[]; (type == "object") and (.name | type == "string")) and any(.[]; .name == "ADMIN_PROVISION_ALLOWED_ORIGIN")' >/dev/null || {
              echo "::error::Trusted invite origin secret not configured or inventory inaccessible"
              exit 1
            }
      - name: Deploy only reviewed admin-provision-user while retaining verify_jwt=true
        shell: bash
        run: |
          set -euo pipefail
          # This workflow must not create an employee, send an email, or change Auth secrets.
          # Separate staff acceptance testing requires explicit operator authorization.
          supabase functions deploy admin-provision-user \
            --project-ref "$PROJECT_REF" --use-api
      - name: Verify greater version, same JWT posture and identical deployed source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$FUNCTION_NAME" > live-after.json
          jq -e --arg n "$FUNCTION_NAME" --argjson prior "$EXPECTED_LIVE_VERSION" \
            '.slug == $n and .status == "ACTIVE" and .version > $prior and .verify_jwt == true' \
            live-after.json > /dev/null
          mkdir -p deployed-source
          (cd deployed-source && supabase --workdir "$PWD" functions download "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --use-api)
          cmp -s "supabase/functions/$FUNCTION_NAME/index.ts" \
            "deployed-source/supabase/functions/$FUNCTION_NAME/index.ts"
          test -s "deployed-source/supabase/functions/_shared/adminProvisionUser.ts"
          cmp -s "supabase/functions/_shared/adminProvisionUser.ts" \
            "deployed-source/supabase/functions/_shared/adminProvisionUser.ts"
          jq '{slug,version,status,verify_jwt,ezbr_sha256}' live-after.json > live-after-sanitized.json
      - name: Verify anonymous and invalid JWT cannot provision users
        shell: bash
        run: |
          set -euo pipefail
          target="https://$PROJECT_REF.supabase.co/functions/v1/$FUNCTION_NAME"
          code="$(curl -sS -o unauth-result.txt -w '%{http_code}' -X POST \
            -H 'content-type: application/json' --data '{}' "$target")"
          test "$code" = "401"
          code="$(curl -sS -o invalid-jwt-result.txt -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -H 'authorization: Bearer invalid-token' \
            --data '{}' "$target")"
          test "$code" = "401"
      - name: Upload non-secret release result for independent inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-provision-update-result-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: |
            live-after-sanitized.json
          retention-days: 30

name: Core Merge Governance

on:
  pull_request:
    branches: [main]
  workflow_run:
    # GitHub Actions deliberately does not fire `check_run` events for check
    # suites that Actions itself created (recursion prevention) -- and every
    # check this workflow depends on is produced by another Actions workflow
    # run. `workflow_run: completed` is the event that actually fires once,
    # after ALL of that run's own jobs (including one gated behind a
    # protected deployment approval that can take hours) have reached a
    # terminal state -- exactly the signal this workflow needs to safely
    # resume on.
    workflows:
      - "Edge Function Governance"
      - "Migration CI and Schema Drift"
      - "WhatsApp Webhook Security"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: core-merge-governance-${{ github.event.pull_request.number || join(github.event.workflow_run.pull_requests.*.number, '-') || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Core merge governance validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Unconditional and first: the context-resolution script below lives in
      # this checkout. Its ref only needs to be *a* valid candidate head for
      # this event (confirmed live-relevant, or discarded, by the next step) --
      # never trusted as final until scripts/resolve-core-merge-governance-context.sh
      # says so.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve governance re-check context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_PR_NUMBERS: ${{ join(github.event.workflow_run.pull_requests.*.number, ',') }}
        run: bash scripts/resolve-core-merge-governance-context.sh

      - name: Skip -- this trigger is not relevant to a live, open, main-targeted PR
        if: steps.ctx.outputs.relevant != 'true'
        run: |
          echo "Workflow-run completion did not correspond to a live launch-governed PR head; nothing to re-evaluate."

      - name: Validate governance shell scripts
        if: steps.ctx.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          bash -n scripts/check-core-main-protection-ruleset.sh
          bash -n scripts/check-pr-launch-relevant-check-runs.sh
          bash -n scripts/resolve-core-merge-governance-context.sh
          bash -n scripts/publish-core-merge-governance-check.sh
          bash -n scripts/detect-pr-edge-governance-paths.sh
          bash -n scripts/detect-pr-whatsapp-webhook-security-paths.sh
          bash -n scripts/tests/verify-core-main-protection-ruleset-contract.sh
          bash -n scripts/tests/verify-pr-launch-relevant-check-runs.sh
          bash -n scripts/tests/verify-core-merge-governance-context-resolution.sh
          bash -n scripts/tests/verify-publish-core-merge-governance-check.sh

      - name: Verify Core Main Protection ruleset repository contract
        if: steps.ctx.outputs.relevant == 'true'
        run: bash scripts/tests/verify-core-main-protection-ruleset-contract.sh

      - name: Verify launch check-run selector regression
        if: steps.ctx.outputs.relevant == 'true'
        run: bash scripts/tests/verify-pr-launch-relevant-check-runs.sh

      - name: Verify Core Merge Governance context resolution regression
        if: steps.ctx.outputs.relevant == 'true'
        run: bash scripts/tests/verify-core-merge-governance-context-resolution.sh

      - name: Verify explicit check-run publishing regression
        if: steps.ctx.outputs.relevant == 'true'
        run: bash scripts/tests/verify-publish-core-merge-governance-check.sh

      - name: Assert live Core Main Protection ruleset matches repository target
        if: steps.ctx.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/check-core-main-protection-ruleset.sh

      - name: Require successful launch-relevant head checks when paths demand them
        if: steps.ctx.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_run')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          GITHUB_BASE_REF: ${{ steps.ctx.outputs.base_ref }}
        run: bash scripts/check-pr-launch-relevant-check-runs.sh

      # A workflow_run-triggered job's own implicit check-run status is
      # reported against the repository's default-branch tip commit, not
      # the triggering producer workflow's PR head -- documented GitHub
      # Actions behavior that `actions/checkout`'s `ref:` cannot change.
      # Without this, a workflow_run re-evaluation could reach the correct
      # conclusion and still never satisfy the PR's required status check.
      # `always()` so this reports on a genuine failure too, not only on
      # success; `job.status` reflects whether every prior step in this job
      # succeeded. Not used on the pull_request path: that path's implicit
      # check-run already lands correctly on the PR head.
      - name: Publish explicit check run on PR head (workflow_run path)
        if: always() && steps.ctx.outputs.relevant == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          CONCLUSION: ${{ job.status }}
        run: bash scripts/publish-core-merge-governance-check.sh

name: Point66 one-shot ordering correction

on:
  push:
    branches:
      - fix/point66-current-main-integrated-20260916
    paths:
      - .github/workflows/point66-ordering-fix.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/point66-current-main-integrated-20260916
          fetch-depth: 0
      - name: Move outgoing/status filter ahead of durable inbound ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/whatsapp-webhook/index.ts")
          source = path.read_text()
          direction_block = '''    const direction: string = (payload?.direction as string) || (payload?.statuses ? "status" : "");\n    if (direction === "outgoing" || direction === "sent" || direction === "status") {\n      if (payload?.statuses) {\n        console.log("Status update received, skipping:", JSON.stringify(payload.statuses).substring(0, 200));\n      }\n      return new Response(JSON.stringify({ ok: true, skipped: "outgoing/status" }), {\n        status: 200, headers: safeWebhookHeaders(),\n      });\n    }\n\n'''
          durable_anchor = '    // Durable ownership must be established before any WAMID/debug dedupe can acknowledge success.\n'
          if source.count(direction_block) != 1:
              raise SystemExit("unexpected outgoing/status block count")
          if source.count(durable_anchor) != 1:
              raise SystemExit("unexpected durable anchor count")
          source = source.replace(direction_block, "", 1)
          source = source.replace(durable_anchor, direction_block + durable_anchor, 1)

          outgoing_pos = source.index('const direction: string =')
          durable_pos = source.index('durablePersistenceFailed(')
          dedupe_pos = source.index('if (messageId) {')
          if not (outgoing_pos < durable_pos < dedupe_pos):
              raise SystemExit("required ordering outgoing/status -> durable -> WAMID dedupe not satisfied")
          if source.count('JSON.stringify({ error: "durable_persistence_failed" })') != 1:
              raise SystemExit("durable failure response contract changed unexpectedly")
          path.write_text(source)
          print("Point66 ordering assertions passed")
          PY
      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/point66-ordering-fix.yml
          git add supabase/functions/whatsapp-webhook/index.ts
          git config user.name "oasis-point66-integration"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(whatsapp): filter outgoing events before durable inbound ownership"
          git push origin HEAD:fix/point66-current-main-integrated-20260916

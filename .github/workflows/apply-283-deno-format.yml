name: Apply 283 Deno formatting repair

on:
  push:
    branches:
      - fix/281-b2b-approval-notification-authority
    paths:
      - .github/workflows/apply-283-deno-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/281-b2b-approval-notification-authority
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format exact notification authority sources
        run: |
          deno fmt \
            supabase/functions/_shared/notifyEventAuthority.ts \
            supabase/functions/_shared/notifyEventAuthority.test.ts \
            supabase/functions/notify-event/index.ts
          rm .github/workflows/apply-283-deno-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/notifyEventAuthority.ts supabase/functions/_shared/notifyEventAuthority.test.ts supabase/functions/notify-event/index.ts .github/workflows/apply-283-deno-format.yml
          git commit -m "style(auth): format notify-event authority" || exit 0
          git push origin HEAD:fix/281-b2b-approval-notification-authority

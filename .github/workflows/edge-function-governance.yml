name: Edge Function Governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: read

jobs:
  path-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      edge: ${{ steps.scope.outputs.edge }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Edge Function governance path scope
        id: scope
        shell: bash
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "edge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          edge="$(bash scripts/detect-pr-edge-governance-paths.sh "$GITHUB_BASE_REF")"
          echo "edge=${edge}" >> "$GITHUB_OUTPUT"

  static-governance:
    name: Static Edge Function governance
    needs: path-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip when Edge Function governance paths are unchanged
        if: needs.path-scope.outputs.edge != 'true'
        run: |
          echo "PR does not touch Edge Function governance paths; Static Edge Function governance not applicable."
      - uses: denoland/setup-deno@v2
        if: needs.path-scope.outputs.edge == 'true'
        with:
          deno-version: v2.x
      - name: Validate Edge Function deployment boundaries
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-edge-function-governance.sh
      - name: Validate complete authentication registry
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-edge-function-auth-registry.sh
      - name: Validate production source reconciliation
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-edge-function-source-reconciliation.sh
      - name: Validate WhatsApp webhook recertification disposition
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-whatsapp-webhook-recertification.sh
      - name: Validate Studio inbox bridge certification controls
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-studio-inbox-bridge-certification.sh
      - name: Validate truthful integration health status
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-integration-health-verification.sh
      - name: Validate registry and configuration reconciliation
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-edge-registry-config-reconciliation.sh
      - name: Validate WhatsApp Gemini retry contract
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-whatsapp-gemini-retry-contract.sh
      - name: Test Stage 1B preview cert auth contract
        if: needs.path-scope.outputs.edge == 'true'
        run: deno test --allow-env --allow-read supabase/functions/_shared/stage1bCert/previewCertAuth.test.ts
      - name: Test dynamic Stage 1B preview pin contract
        if: needs.path-scope.outputs.edge == 'true'
        run: deno test --allow-env supabase/functions/_shared/stage1bCert/previewPin.test.ts
      - name: Test MSG91 session bridge contracts
        if: needs.path-scope.outputs.edge == 'true'
        run: deno test --allow-env --allow-net supabase/functions/_shared/msg91SessionBridge.test.ts
      - name: Test WhatsApp packet AI worker contracts
        if: needs.path-scope.outputs.edge == 'true'
        run: >-
          deno test --allow-env --allow-net
          supabase/functions/whatsapp-packet-ai-worker/index.test.ts
          supabase/functions/_shared/geminiProvider.test.ts
      - name: Validate runtime certification evidence gate
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-edge-runtime-certification.sh
      - name: Validate preview Edge Runtime secrets configuration
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-preview-edge-runtime-secrets-config.sh
      - name: Test current PR preview targeting contract
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/tests/verify-preview-edge-runtime-secrets-targeting.sh

  provision-preview-dotenv:
    name: Provision encrypted preview Edge Runtime env
    needs: [path-scope, static-governance]
    if: needs.path-scope.outputs.edge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pushed: ${{ steps.env_refresh.outputs.pushed }}
      provisioned_sha: ${{ steps.provisioned_head.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.110.0
      - name: Require preview Edge Runtime secret inputs
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${WA_STAGE1B_CERT_SECRET:-}" ]]; then
            echo "::error::WA_STAGE1B_CERT_SECRET_REQUIRED" >&2
            exit 1
          fi
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GEMINI_API_KEY_REQUIRED" >&2
            exit 1
          fi
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN_REQUIRED" >&2
            exit 1
          fi
      - name: Materialize encrypted supabase/.env.preview and upload dotenvx authority
        id: env_refresh
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
          PREVIEW_DOTENV_PRIVATE_KEY: ${{ secrets.PREVIEW_DOTENV_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_PROJECT_REF: tcxvcatsqqertcnycuop
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git check-ref-format --branch "$PUSH_BRANCH" >/dev/null
          result="$(bash scripts/materialize-supabase-env-preview.sh)"
          echo "$result"
          if [[ "$result" == "generated_new_dotenvx_keys" ]]; then
            export PREVIEW_DOTENVX_UPLOAD_REQUIRED=true
          else
            export PREVIEW_DOTENVX_UPLOAD_REQUIRED=false
          fi
          bash scripts/upload-preview-dotenvx-keys.sh
          upload_result=$?
          if [[ "$upload_result" -ne 0 ]]; then
            exit "$upload_result"
          fi
          if [[ ! -f supabase/.env.preview ]] \
            || ! bash scripts/verify-preview-env-decryptable.sh; then
            rm -f supabase/.env.preview supabase/.env.keys
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/.env.preview
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(ci): refresh encrypted supabase preview edge env"
          remote_sha="$(git ls-remote --heads origin "refs/heads/${PUSH_BRANCH}" | awk 'NR == 1 {print $1}')"
          if [[ "$remote_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::PR branch moved after certification; refusing to push encrypted preview env" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${PUSH_BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Capture provisioned immutable head
        id: provisioned_head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  runtime-governance:
    name: Preview Edge Runtime readiness
    needs: [path-scope, provision-preview-dotenv]
    if: always() && needs.path-scope.result == 'success' && (needs.provision-preview-dotenv.result == 'success' || needs.provision-preview-dotenv.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Skip when Edge Function governance paths are unchanged
        if: needs.path-scope.outputs.edge != 'true'
        run: |
          echo "PR does not touch Edge Function governance paths; Preview Edge Runtime readiness not applicable."
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: needs.path-scope.outputs.edge == 'true'
        with:
          ref: ${{ needs.provision-preview-dotenv.outputs.provisioned_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for Supabase Preview redeploy after encrypted env refresh
        if: needs.path-scope.outputs.edge == 'true' && needs.provision-preview-dotenv.outputs.pushed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/wait-for-supabase-preview-check.sh "$(git rev-parse HEAD)"
      - name: Require encrypted preview env before runtime readiness probe
        if: needs.path-scope.outputs.edge == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f supabase/.env.preview ]] || ! grep -Fq 'encrypted:' supabase/.env.preview; then
            echo "::error::PREVIEW_DOTENVX_PRODUCTION_AUTHORITY_DEFERRED" >&2
            exit 1
          fi
      - name: Wait for preview Edge Function deploy propagation
        if: needs.path-scope.outputs.edge == 'true'
        run: sleep 90
      - name: Ensure Supabase preview branch for edge-only PR participation
        if: needs.path-scope.outputs.edge == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_PROJECT_REF: tcxvcatsqqertcnycuop
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_PR_HEAD_SHA"
          bash scripts/ensure-supabase-preview-branch.sh
      - name: Resolve current Supabase preview project ref
        if: needs.path-scope.outputs.edge == 'true'
        id: preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_PROJECT_REF: tcxvcatsqqertcnycuop
        run: |
          set -euo pipefail
          export GITHUB_PR_HEAD_SHA="$(git rev-parse HEAD)"
          preview_ref="$(bash scripts/wait-for-current-pr-preview-ref.sh)"
          echo "preview_ref=${preview_ref}" >> "$GITHUB_OUTPUT"
      - name: Validate preview Edge Runtime secret readiness on cert preview
        if: needs.path-scope.outputs.edge == 'true'
        run: bash scripts/check-preview-edge-runtime-secrets-readiness.sh
        env:
          WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
          WA_STAGE1B_PREVIEW_REF: ${{ steps.preview.outputs.preview_ref }}

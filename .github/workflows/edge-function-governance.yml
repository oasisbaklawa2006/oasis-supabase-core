name: Edge Function Governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  path-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      edge_static: ${{ steps.scope.outputs.edge_static }}
      edge_runtime: ${{ steps.scope.outputs.edge_runtime }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Edge Function governance path scope
        id: scope
        shell: bash
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "edge_static=true" >> "$GITHUB_OUTPUT"
            echo "edge_runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          edge_static="$(bash scripts/detect-pr-edge-governance-paths.sh "$GITHUB_BASE_REF" static)"
          edge_runtime="$(bash scripts/detect-pr-edge-governance-paths.sh "$GITHUB_BASE_REF" runtime)"
          echo "edge_static=${edge_static}" >> "$GITHUB_OUTPUT"
          echo "edge_runtime=${edge_runtime}" >> "$GITHUB_OUTPUT"

  static-governance:
    name: Static Edge Function governance
    needs: path-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip when Edge Function governance paths are unchanged
        if: needs.path-scope.outputs.edge_static != 'true'
        run: |
          echo "PR does not touch Edge Function governance paths; Static Edge Function governance not applicable."
      - uses: denoland/setup-deno@v2
        if: needs.path-scope.outputs.edge_static == 'true'
        with:
          deno-version: v2.x
      - name: Validate Edge Function deployment boundaries
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-edge-function-governance.sh
      - name: Validate complete authentication registry
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-edge-function-auth-registry.sh
      - name: Validate production source reconciliation
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-edge-function-source-reconciliation.sh
      - name: Validate WhatsApp webhook recertification disposition
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-whatsapp-webhook-recertification.sh
      - name: Validate governed WhatsApp production release lane
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-whatsapp-webhook-production-release.sh
      - name: Validate governed admin-provision-user production first-deploy lane
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-admin-provision-user-production-first-deploy.sh
      - name: Test deterministic Edge source manifest
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/tests/verify-edge-function-source-manifest.sh
      - name: Test deployed-source closure fail-closed behavior
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/tests/verify-deployed-edge-function-source-closure.sh
      - name: Test worker signed release workflow contract
        if: needs.path-scope.outputs.edge_static == 'true'
        run: python3 scripts/tests/test-worker-deployment-attestation-workflow.py
      - name: Test worker deployment-time source attestation evidence class
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/tests/verify-worker-deployment-source-attestation.sh
      - name: Test fail-closed WhatsApp worker source certification
        if: needs.path-scope.outputs.edge_static == 'true'
        run: python3 -m unittest discover -s scripts -p 'test_worker_source_certification.py' -v
      - name: Validate Studio inbox bridge certification controls
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-studio-inbox-bridge-certification.sh
      - name: Validate truthful integration health status
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-integration-health-verification.sh
      - name: Validate registry and configuration reconciliation
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-edge-registry-config-reconciliation.sh
      - name: Validate WhatsApp Gemini retry contract
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-whatsapp-gemini-retry-contract.sh
      - name: Validate shared integration retry contract
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-integration-retry-contract.sh
      - name: Test shared integration retry contract
        if: needs.path-scope.outputs.edge_static == 'true'
        run: deno test --allow-env supabase/functions/_shared/integrationRetryContract.test.ts
      - name: Test Stage 1B preview cert auth contract
        if: needs.path-scope.outputs.edge_static == 'true'
        run: deno test --allow-env --allow-read supabase/functions/_shared/stage1bCert/previewCertAuth.test.ts
      - name: Test dynamic Stage 1B preview pin contract
        if: needs.path-scope.outputs.edge_static == 'true'
        run: deno test --allow-env supabase/functions/_shared/stage1bCert/previewPin.test.ts
      - name: Test MSG91 session bridge contracts
        if: needs.path-scope.outputs.edge_static == 'true'
        run: deno test --allow-env --allow-net supabase/functions/_shared/msg91SessionBridge.test.ts
      - name: Test WhatsApp packet AI worker contracts
        if: needs.path-scope.outputs.edge_static == 'true'
        run: >-
          deno test --allow-env --allow-net
          supabase/functions/whatsapp-packet-ai-worker/index.test.ts
          supabase/functions/_shared/geminiProvider.test.ts
      - name: Validate runtime certification evidence gate
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-edge-runtime-certification.sh
      - name: Validate preview Edge Runtime secrets configuration
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/check-preview-edge-runtime-secrets-config.sh
      - name: Test current PR preview targeting contract
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/tests/verify-preview-edge-runtime-secrets-targeting.sh
      - name: Test Buyer Genie first-deploy lane retirement
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/tests/verify-buyer-genie-first-deploy-retirement.sh
      - name: Test Preview Edge Runtime readiness checkout fallback
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/tests/verify-preview-edge-runtime-checkout-fallback.sh
      - name: Test preview branch fail-closed behavior (no mutations)
        if: needs.path-scope.outputs.edge_static == 'true'
        run: python3 scripts/tests/verify-preview-branch-no-auto-mutation.py
      - name: Test preview dotenv authority hardening (fail-closed, no readback, no PR key writes)
        if: needs.path-scope.outputs.edge_static == 'true'
        run: bash scripts/tests/verify-preview-dotenv-authority-hardening.sh

  # This job and `runtime-governance` run for ordinary pull requests, so they
  # receive NO Supabase credential, NO dotenvx private key and NO production
  # secret: only `github.token` (read-only) and the cert-runner probe secret.
  # Key custody, key rotation and every privileged Supabase operation live in
  # the protected `sync-preview-cert-edge-secrets.yml` workflow. The check name
  # is kept because Core merge governance requires it for runtime-scoped PRs.
  provision-preview-dotenv:
    name: Provision encrypted preview Edge Runtime env
    needs: [path-scope, static-governance]
    if: needs.path-scope.outputs.edge_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      provisioned_sha: ${{ steps.provisioned_head.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Offline and credential-free: proves a hosted Supabase Preview success
      # would actually exercise the encrypted secrets (declared in config.toml,
      # encrypted in .env.preview, no private key committed).
      - name: Check hosted-proof preconditions (offline, no credentials)
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          bash scripts/check-preview-hosted-proof-preconditions.sh
      - name: Capture provisioned immutable head
        id: provisioned_head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  runtime-governance:
    name: Preview Edge Runtime readiness
    needs: [path-scope, provision-preview-dotenv]
    if: always() && needs.path-scope.result == 'success' && (needs.path-scope.outputs.edge_runtime != 'true' || needs.provision-preview-dotenv.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      checks: read
    steps:
      - name: Skip when preview Edge Runtime launch paths are unchanged
        if: needs.path-scope.outputs.edge_runtime != 'true'
        run: |
          echo "PR does not touch preview Edge Runtime launch paths; Preview Edge Runtime readiness not applicable."
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: needs.path-scope.outputs.edge_runtime == 'true'
        with:
          ref: ${{ needs.provision-preview-dotenv.outputs.provisioned_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for preview Edge Function deploy propagation
        if: needs.path-scope.outputs.edge_runtime == 'true'
        run: sleep 90
      # Hosted authority: the preview project ref and the success of the real
      # Supabase-hosted decryption both come from the trusted Supabase GitHub
      # App's `Supabase Preview` check-run on this exact head, read with the
      # read-only github.token. This job never creates, rebases or resets a
      # preview branch and holds no Management API credential: if the Supabase
      # integration did not provision a preview (for example, the concurrent
      # branch limit), it fails closed with PREVIEW_NOT_PROVISIONED.
      - name: Resolve preview project ref from the trusted hosted Supabase Preview check
        if: needs.path-scope.outputs.edge_runtime == 'true'
        id: preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_PR_HEAD_SHA"
          preview_ref="$(bash scripts/wait-for-current-pr-preview-ref.sh)"
          echo "preview_ref=${preview_ref}" >> "$GITHUB_OUTPUT"
      - name: Validate preview Edge Runtime secret readiness on cert preview
        if: needs.path-scope.outputs.edge_runtime == 'true'
        run: bash scripts/check-preview-edge-runtime-secrets-readiness.sh
        env:
          WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
          WA_STAGE1B_PREVIEW_REF: ${{ steps.preview.outputs.preview_ref }}

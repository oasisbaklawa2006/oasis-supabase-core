name: Buyer Genie Production First Deploy (RETIRED)

# =================================================================================
# RETIRED 2026-10-09 as part of the Oasis Appverse P0 migration/launch-blocker
# recovery.
#
# This workflow's purpose was a single, one-time, approval-gated first
# production deployment of the `ai-order-parse` Edge Function, guarded by an
# explicit "absent before first deploy" (HTTP 404) precondition in both its
# preflight job ("Prove ai-order-parse is absent from production before
# first deploy") and its deploy job ("Recheck first-deploy state").
#
# That precondition is no longer true. `ai-order-parse` is independently
# confirmed ACTIVE in production -- status=ACTIVE, version=3,
# verify_jwt=true -- via a direct read of the Supabase Management API for
# project tcxvcatsqqertcnycuop on 2026-10-09. oasis-baklawa PR #58 already
# records the same fact in its own Buyer UAT reconciliation
# ("records production ai-order-parse as ACTIVE/JWT-protected while
# preserving Genie OFF/fail-closed"). Running this workflow again would
# therefore always fail its own absent-before-first-deploy assertions --
# it is dead by its own logic, independent of the governance finding below.
#
# Separately, its now-unreachable "Deploy only ai-order-parse" step invoked
# the Supabase CLI's function-deploy subcommand against a shell-expanded
# `${FUNCTION_NAME}` variable rather than a literal function name --
# an indirection that scripts/check-edge-function-governance.sh's
# broad-deploy scanner cannot certify as scoped to one literal function,
# even though FUNCTION_NAME was itself hardcoded to `ai-order-parse` at the
# workflow-env level. Per standing instruction not to relax that scanner,
# and because the workflow's own one-time purpose is already fulfilled,
# this workflow is retired outright rather than corrected to a literal
# deploy target for a deployment it can never legitimately perform again.
#
# This job is retired to fail closed rather than deleted, so its prior run
# history and artifacts (the original successful first-deploy attestation,
# buyer-genie-first-deploy-attestation.json) remain visible for audit. If
# ai-order-parse ever needs a genuine new first-deploy-style activation
# (e.g. a full redeploy after deletion), build a new, separately-reviewed
# workflow against the then-current state -- never resurrect this one by
# removing its fail-closed guard.
# =================================================================================

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired -- see workflow file header
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "::error::Buyer Genie Production First Deploy is retired. ai-order-parse is already ACTIVE in production (independently confirmed 2026-10-09); this workflow's absent-before-first-deploy precondition can never be satisfied again, and its prior broad-deploy-shaped step is not being revived. See this workflow file's header comment for the full rationale."
          exit 1

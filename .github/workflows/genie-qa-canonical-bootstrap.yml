name: Genie QA Canonical Schema Bootstrap (manual, protected)

# No push or pull_request trigger: opening a source PR must not create a paid
# Supabase Preview as a side effect of this QA release workflow.
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact current protected Core main SHA (40 hex)"
        required: true
        type: string
      mode:
        description: "Empty-project preflight/apply or populated-project preflight-forward/apply-forward"
        required: true
        type: choice
        options: [preflight, apply, preflight-forward, apply-forward]
        default: preflight
      change_reference:
        description: "Core#495/Buyer#74 plus approved QA change reference"
        required: true
        type: string
      authorization:
        description: "apply: AUTHORIZE-GENIE-QA-CANONICAL-BOOTSTRAP. apply-forward: AUTHORIZE-GENIE-QA-FORWARD-APPLY"
        required: false
        type: string
      qa_ledger_count:
        description: "forward modes: exact number of migration versions currently recorded in QA (for example 516)"
        required: false
        type: string
        default: ""
      qa_ledger_max_version:
        description: "forward modes: exact latest migration version currently recorded in QA (14 digits)"
        required: false
        type: string
        default: ""
      expected_total_migrations:
        description: "forward modes: exact total migration count at the approved main SHA after the forward apply"
        required: false
        type: string
        default: ""

      recovery_reference:
        description: "apply-forward: independently verified recovery evidence comment (Core#495:RECOVERY-VERIFIED:<comment-id>)"
        required: false
        type: string
        default: ""
      verified_state_sha256:
        description: "apply-forward: protected data fingerprint from reviewed forward preflight"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: genie-qa-canonical-bootstrap
  cancel-in-progress: false

jobs:
  schema:
    if: github.repository == 'oasisbaklawa2006/oasis-supabase-core' && github.ref == 'refs/heads/main'
    name: Canonical replay against exclusively pinned Genie QA
    runs-on: ubuntu-24.04
    environment: genie-qa-bootstrap
    timeout-minutes: 95
    env:
      GENIE_QA_PROJECT_REF: skhpmltfjgqitntkmclb
      GENIE_QA_EXPECTED_SHA: ${{ inputs.expected_head_sha }}
      GENIE_QA_RUN_MODE: ${{ inputs.mode }}
      GENIE_QA_CHANGE_REFERENCE: ${{ inputs.change_reference }}
      GENIE_QA_APPROVAL_PHRASE: ${{ inputs.authorization }}
      GENIE_QA_FORWARD_LEDGER_COUNT: ${{ inputs.qa_ledger_count }}
      GENIE_QA_FORWARD_LEDGER_MAX: ${{ inputs.qa_ledger_max_version }}
      GENIE_QA_FORWARD_TOTAL: ${{ inputs.expected_total_migrations }}
      GENIE_QA_RECOVERY_REFERENCE: ${{ inputs.recovery_reference }}
      GENIE_QA_VERIFIED_STATE_SHA256: ${{ inputs.verified_state_sha256 }}
      GENIE_QA_DATABASE_URL: ${{ secrets.GENIE_QA_DATABASE_URL }}
      GENIE_QA_CA_CERT_PEM: ${{ secrets.GENIE_QA_CA_CERT_PEM }}
      SUPABASE_CLI_VERSION: 2.110.0
    steps:
      - name: Checkout approved exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check immutable source and QA-only target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GENIE_QA_EXPECTED_SHA"
          test "$GENIE_QA_PROJECT_REF" = "skhpmltfjgqitntkmclb"
          python3 scripts/genie-qa/verify_qa_target.py
          python3 -m unittest discover -s scripts/tests -p 'test_genie_qa_*.py' -v
          # Historical baseline installs pg_cron/pg_net. Never replay the
          # original migrations directly into QA; create an exact-hash-pinned
          # ephemeral no-egress copy, rejecting any other migration drift.
          python3 scripts/genie-qa/build_no_egress_overlay.py --output "$RUNNER_TEMP/genie-qa-overlay"
          python3 scripts/genie-qa/verify_no_outbound.py "$RUNNER_TEMP/genie-qa-overlay/supabase/migrations"
          echo "SUPABASE_WORKDIR=$RUNNER_TEMP/genie-qa-overlay" >> "$GITHUB_ENV"
          bash scripts/check-production-baseline.sh

      - name: Require trusted QA TLS CA and prepare credential-free logs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GENIE_QA_CA_CERT_PEM" || { echo "::error::GENIE_QA_CA_MISSING"; exit 1; }
          printf '%s\n' "$GENIE_QA_CA_CERT_PEM" > "$RUNNER_TEMP/genie-qa-ca.crt"
          chmod 600 "$RUNNER_TEMP/genie-qa-ca.crt"
          openssl x509 -in "$RUNNER_TEMP/genie-qa-ca.crt" -noout >/dev/null \
            || { echo "::error::GENIE_QA_CA_INVALID"; exit 1; }
          echo "PGSSLMODE=verify-full" >> "$GITHUB_ENV"
          echo "PGSSLROOTCERT=$RUNNER_TEMP/genie-qa-ca.crt" >> "$GITHUB_ENV"

      - name: Prove QA ledger is an exact prefix of the reviewed sequence (forward mode only)
        if: inputs.mode == 'preflight-forward' || inputs.mode == 'apply-forward'
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          [[ "$GENIE_QA_FORWARD_LEDGER_COUNT" =~ ^[1-9][0-9]{2,3}$ ]] || { echo "::error::GENIE_QA_FORWARD_LEDGER_COUNT_INVALID"; exit 1; }
          [[ "$GENIE_QA_FORWARD_LEDGER_MAX" =~ ^[0-9]{14}$ ]] || { echo "::error::GENIE_QA_FORWARD_LEDGER_MAX_INVALID"; exit 1; }
          [[ "$GENIE_QA_FORWARD_TOTAL" =~ ^[1-9][0-9]{2,3}$ ]] || { echo "::error::GENIE_QA_FORWARD_TOTAL_INVALID"; exit 1; }
          test "$GENIE_QA_FORWARD_LEDGER_COUNT" -lt "$GENIE_QA_FORWARD_TOTAL" || { echo "::error::GENIE_QA_FORWARD_NOTHING_TO_APPLY"; exit 1; }
          find "$SUPABASE_WORKDIR/supabase/migrations" -maxdepth 1 -name '*.sql' -type f -printf '%f\n' \
            | sed -nE 's/^([0-9]{14})_.*\.sql$/\1/p' | LC_ALL=C sort > "$RUNNER_TEMP/qa-source-versions.txt"
          test "$(wc -l < "$RUNNER_TEMP/qa-source-versions.txt" | tr -d ' ')" = "$GENIE_QA_FORWARD_TOTAL" \
            || { echo "::error::GENIE_QA_FORWARD_SOURCE_COUNT_MISMATCH"; exit 1; }
          test "$(sort -u "$RUNNER_TEMP/qa-source-versions.txt" | wc -l | tr -d ' ')" = "$GENIE_QA_FORWARD_TOTAL" \
            || { echo "::error::GENIE_QA_FORWARD_SOURCE_VERSION_DUPLICATE"; exit 1; }
          head -n "$GENIE_QA_FORWARD_LEDGER_COUNT" "$RUNNER_TEMP/qa-source-versions.txt" > "$RUNNER_TEMP/qa-expected-prefix.txt"
          psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c 'select version from supabase_migrations.schema_migrations order by version' \
            > "$RUNNER_TEMP/qa-recorded-versions.txt" 2>/dev/null \
            || { echo "::error::GENIE_QA_FORWARD_LEDGER_READ_FAILED"; exit 1; }
          cmp -s "$RUNNER_TEMP/qa-expected-prefix.txt" "$RUNNER_TEMP/qa-recorded-versions.txt" \
            || { echo "::error::GENIE_QA_FORWARD_LEDGER_NOT_A_PREFIX"; exit 1; }
          test "$(tail -n 1 "$RUNNER_TEMP/qa-recorded-versions.txt")" = "$GENIE_QA_FORWARD_LEDGER_MAX" \
            || { echo "::error::GENIE_QA_FORWARD_LEDGER_MAX_MISMATCH"; exit 1; }
          echo "GENIE_QA_FORWARD_LEDGER_PREFIX_PROVEN: ${GENIE_QA_FORWARD_LEDGER_COUNT} recorded versions are the exact first ${GENIE_QA_FORWARD_LEDGER_COUNT} of ${GENIE_QA_FORWARD_TOTAL}"
      - name: Prove QA database is clean before any remote migration
        if: inputs.mode == 'preflight' || inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          status="$(psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c "select (select count(*)::int from auth.users)::text || '|' || (select count(*)::int from information_schema.tables where table_schema='public' and table_type='BASE TABLE')::text")" \
            || { echo "::error::GENIE_QA_PREFLIGHT_SQL_FAILED"; exit 1; }
          test "$status" = "0|0" || { echo "::error::GENIE_QA_NOT_EMPTY"; exit 1; }

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Match the pinned Deno runtime used by the canonical Core Migration CI.
      # Point23 reconnect/replay probes are mandatory within local readiness.
      - name: Set up pinned Deno for Point23 local contract probes
        uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x

      - name: Prove exact Git baseline + full local clean migration replay and contracts
        shell: bash
        run: |
          set -euo pipefail
          # Canonical local replay must not inherit remote overlay or TLS settings.
          # These overrides are scoped to this subprocess; QA remote TLS stays strict.
          env -u SUPABASE_WORKDIR -u PGSSLMODE -u PGSSLROOTCERT \
            bash scripts/verify-local-schema-release-readiness.sh

      - name: Dry-run the full QA-only canonical migration sequence
        shell: bash
        run: |
          set -euo pipefail
          test "${SUPABASE_WORKDIR:-}" = "$RUNNER_TEMP/genie-qa-overlay"
          test -d "$SUPABASE_WORKDIR/supabase/migrations"
          test "$(head -n 1 "$SUPABASE_WORKDIR/supabase/config.toml")" = 'project_id = "skhpmltfjgqitntkmclb"'
          cd "$SUPABASE_WORKDIR"
          if ! supabase db push --db-url "$GENIE_QA_DATABASE_URL" --dry-run \
               > "$RUNNER_TEMP/genie-qa-dry-run.log" 2>&1; then
            echo "::error::GENIE_QA_REMOTE_DRY_RUN_FAILED (credential-bearing logs withheld)"
            exit 1
          fi
          echo "GENIE_QA_NO_EGRESS_OVERLAY_DRY_RUN_PASS; no remote schema applied"

      - name: Explicitly authorized QA-only apply (never production)
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          test "$GENIE_QA_APPROVAL_PHRASE" = 'AUTHORIZE-GENIE-QA-CANONICAL-BOOTSTRAP'
          # Reviewed immutable historical scheduler functions cannot run
          # without the associated extensions. The canonical source scanner
          # rejects new scheduling/egress SQL and extension DDL.
          test "${SUPABASE_WORKDIR:-}" = "$RUNNER_TEMP/genie-qa-overlay"
          python3 scripts/genie-qa/verify_no_outbound.py "$SUPABASE_WORKDIR/supabase/migrations"
          egress_state="$(psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c "select case when exists(select 1 from pg_extension where extname in ('pg_cron','pg_net','http','dblink')) or to_regclass('cron.job') is not null then 'unsafe' else 'safe' end")" \
            || { echo "::error::GENIE_QA_EGRESS_PRECHECK_FAILED"; exit 1; }
          test "$egress_state" = "safe" \
            || { echo "::error::GENIE_QA_EGRESS_EXTENSIONS_PRESENT"; exit 1; }
          test -d "$SUPABASE_WORKDIR/supabase/migrations"
          test "$(head -n 1 "$SUPABASE_WORKDIR/supabase/config.toml")" = 'project_id = "skhpmltfjgqitntkmclb"'
          cd "$SUPABASE_WORKDIR"
          if ! supabase db push --db-url "$GENIE_QA_DATABASE_URL" --yes \
               > "$RUNNER_TEMP/genie-qa-apply.log" 2>&1; then
            echo "::error::GENIE_QA_APPLY_FAILED; do not retry or repair migration ledger blindly"
            exit 1
          fi
          # Migration must not have enabled a scheduler, outbound HTTP
          # extension, or a cron-job table. A failure is a release NO-GO.
          egress_after="$(psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c "select case when exists(select 1 from pg_extension where extname in ('pg_cron','pg_net','http','dblink')) or to_regclass('cron.job') is not null then 'unsafe' else 'safe' end")" \
            || { echo "::error::GENIE_QA_EGRESS_POSTCHECK_FAILED"; exit 1; }
          test "$egress_after" = "safe" \
            || { echo "::error::GENIE_QA_EGRESS_AFTER_APPLY"; exit 1; }
          expected="$(find supabase/migrations -maxdepth 1 -name '*.sql' -type f | wc -l | tr -d ' ')"
          current="$(psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c 'select count(*)::int from supabase_migrations.schema_migrations')" \
            || { echo "::error::GENIE_QA_LEDGER_READ_FAILED"; exit 1; }
          test "$current" = "$expected" \
            || { echo "::error::GENIE_QA_LEDGER_INCOMPLETE"; exit 1; }
          verdict="$(psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c "select (position('PT409' in pg_get_functiondef('public.update_customer_order_draft_line_genie_if_quantity_v1(uuid,uuid,numeric,numeric)'::regprocedure)) > 0)::text")" \
            || { echo "::error::GENIE_QA_PT409_READ_FAILED"; exit 1; }
          test "$verdict" = "true" || { echo "::error::GENIE_QA_PT409_MISSING"; exit 1; }
          echo "GENIE_QA_SAFE_OVERLAY_BOOTSTRAP_PASS: full ledger and PT409 present; pg_cron/pg_net intentionally absent; Auth/device acceptance NOT RUN"

      - name: Provision and verify PostgreSQL 17 client tools
        if: inputs.mode == 'preflight-forward' || inputs.mode == 'apply-forward'
        shell: bash
        run: |
          set -euo pipefail
          env -u GENIE_QA_DATABASE_URL -u GENIE_QA_CA_CERT_PEM bash scripts/genie-qa/install_pg17_client.sh

      - name: Capture encrypted QA recovery archive and preservation baseline
        if: inputs.mode == 'preflight-forward' || inputs.mode == 'apply-forward'
        shell: bash
        env:
          GENIE_QA_BACKUP_PASSPHRASE: ${{ secrets.GENIE_QA_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          bash scripts/genie-qa/capture_forward_backup.sh

      - name: Retain encrypted QA recovery archive
        id: forward_backup_upload
        if: inputs.mode == 'preflight-forward' || inputs.mode == 'apply-forward'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genie-qa-encrypted-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/genie-qa-encrypted-backup/backup.tar.gpg
            ${{ runner.temp }}/genie-qa-encrypted-backup/backup.tar.gpg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Verify recovery archive retention and unchanged protected data
        if: inputs.mode == 'preflight-forward' || inputs.mode == 'apply-forward'
        shell: bash
        env:
          QA_ARTIFACT_ID: ${{ steps.forward_backup_upload.outputs.artifact-id }}
          QA_ARTIFACT_DIGEST: ${{ steps.forward_backup_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$QA_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::QA_BACKUP_UPLOAD_UNVERIFIED"; exit 1; }
          [[ "$QA_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]] || { echo "::error::QA_BACKUP_DIGEST_UNVERIFIED"; exit 1; }
          bash scripts/genie-qa/forward_preservation.sh "$RUNNER_TEMP/qa-preservation-before.json"
          actual="$(sha256sum "$RUNNER_TEMP/qa-preservation-before.json" | cut -d ' ' -f1)"
          if [[ "$GENIE_QA_RUN_MODE" == apply-forward ]]; then
            test "$actual" = "$GENIE_QA_VERIFIED_STATE_SHA256" || { echo "::error::QA_REVIEWED_BASELINE_CHANGED"; exit 1; }
          fi
          echo "QA_FORWARD_BASELINE_SHA256=$actual"
          echo "QA_ENCRYPTED_RECOVERY_ARTIFACT_ID=$QA_ARTIFACT_ID"
          echo "QA_ENCRYPTED_RECOVERY_ARTIFACT_DIGEST=$QA_ARTIFACT_DIGEST"
          echo "QA_BACKUP_INTEGRITY_PASS; restoration rehearsal is a separate mandatory review gate"

      - name: Explicitly authorized QA-only forward apply (never production)
        id: forward_apply
        if: inputs.mode == 'apply-forward'
        shell: bash
        run: |
          set -euo pipefail
          test "$GENIE_QA_APPROVAL_PHRASE" = 'AUTHORIZE-GENIE-QA-FORWARD-APPLY'
          test "${SUPABASE_WORKDIR:-}" = "$RUNNER_TEMP/genie-qa-overlay"
          python3 scripts/genie-qa/verify_no_outbound.py "$SUPABASE_WORKDIR/supabase/migrations"
          egress_state="$(psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c "select case when exists(select 1 from pg_extension where extname in ('pg_cron','pg_net','http','dblink')) or to_regclass('cron.job') is not null then 'unsafe' else 'safe' end")" \
            || { echo "::error::GENIE_QA_EGRESS_PRECHECK_FAILED"; exit 1; }
          test "$egress_state" = "safe" \
            || { echo "::error::GENIE_QA_EGRESS_EXTENSIONS_PRESENT"; exit 1; }
          test -d "$SUPABASE_WORKDIR/supabase/migrations"
          test "$(head -n 1 "$SUPABASE_WORKDIR/supabase/config.toml")" = 'project_id = "skhpmltfjgqitntkmclb"'
          cd "$SUPABASE_WORKDIR"
          if ! supabase db push --db-url "$GENIE_QA_DATABASE_URL" --yes \
               > "$RUNNER_TEMP/genie-qa-forward-apply.log" 2>&1; then
            echo "::error::GENIE_QA_FORWARD_APPLY_FAILED; do not retry or repair migration ledger blindly"
            exit 1
          fi
          egress_after="$(psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c "select case when exists(select 1 from pg_extension where extname in ('pg_cron','pg_net','http','dblink')) or to_regclass('cron.job') is not null then 'unsafe' else 'safe' end")" \
            || { echo "::error::GENIE_QA_EGRESS_POSTCHECK_FAILED"; exit 1; }
          test "$egress_after" = "safe" \
            || { echo "::error::GENIE_QA_EGRESS_AFTER_APPLY"; exit 1; }
          psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c 'select version from supabase_migrations.schema_migrations order by version' \
            > "$RUNNER_TEMP/qa-recorded-after.txt" 2>/dev/null \
            || { echo "::error::GENIE_QA_LEDGER_READ_FAILED"; exit 1; }
          cmp -s "$RUNNER_TEMP/qa-source-versions.txt" "$RUNNER_TEMP/qa-recorded-after.txt" \
            || { echo "::error::GENIE_QA_LEDGER_INCOMPLETE"; exit 1; }
          verdict="$(psql "$GENIE_QA_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c "select (position('PT409' in pg_get_functiondef('public.update_customer_order_draft_line_genie_if_quantity_v1(uuid,uuid,numeric,numeric)'::regprocedure)) > 0)::text")" \
            || { echo "::error::GENIE_QA_PT409_READ_FAILED"; exit 1; }
          test "$verdict" = "true" || { echo "::error::GENIE_QA_PT409_MISSING"; exit 1; }
          echo "GENIE_QA_FORWARD_APPLY_PASS: full ledger equals the reviewed sequence; PT409 present; pg_cron/pg_net absent; Auth/device acceptance NOT RUN"

      - name: Verify protected data survived forward apply
        if: always() && inputs.mode == 'apply-forward' && (steps.forward_apply.outcome == 'success' || steps.forward_apply.outcome == 'failure' || steps.forward_apply.outcome == 'cancelled')
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/genie-qa/forward_preservation.sh "$RUNNER_TEMP/qa-preservation-before.json"
          echo 'QA_PROTECTED_DATA_UNCHANGED; separate device and security regression acceptance required'

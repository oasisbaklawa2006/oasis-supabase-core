name: MSG91 Legacy Mode Source-Only Branch Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/msg91-otp/**"
      - "supabase/tests/msg91_*.test.mjs"
      - "supabase/tests/fixtures/msg91_*"
      - "supabase/migrations/20261110150000_msg91_identity_resolution_authority_v1.sql"
      - ".github/workflows/msg91-legacy-source-branch.yml"
  push:
    branches:
      - security/core-msg91-legacy-mode-guard-20261110
    paths:
      - "supabase/functions/msg91-otp/**"
      - "supabase/tests/msg91_*.test.mjs"
      - "supabase/tests/fixtures/msg91_*"
      - "supabase/migrations/20261110150000_msg91_identity_resolution_authority_v1.sql"
      - ".github/workflows/msg91-legacy-source-branch.yml"

permissions:
  contents: read

jobs:
  offline-denial-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Verify offline Node runtime denial and exchange-flow contracts
        run: node --test supabase/tests/msg91_legacy_modes_guard.test.mjs supabase/tests/msg91_identity_flow.test.mjs
      - name: Start scratch PostgreSQL for identity-authority behavioural tests
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "alter user postgres password 'ci'"
      - name: Verify database identity authority (real SQL, locking, scale)
        env:
          CI: "true"
          MSG91_TEST_PG_ADMIN_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
        run: |
          npm install --no-save --no-package-lock pg@8.13.1
          node --test supabase/tests/msg91_identity_authority.test.mjs
      - name: Install pinned Deno toolchain (no deployment credentials)
        uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x
      - name: Typecheck captured Edge function and local policy import
        run: deno check supabase/functions/msg91-otp/index.ts

name: Finance format artifact

on:
  push:
    branches:
      - cursor/financial-ledger-authority-tests-b99a

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x
          cache: true
      - name: Produce canonical Deno formatting
        run: >-
          deno fmt
          supabase/functions/_shared/financialLedgerAuthority.ts
          supabase/functions/_shared/financialLedgerAuthority.test.ts
          supabase/functions/generate-bi-monthly-ledger/index.ts
          supabase/functions/generate-rescue-ledger/index.ts
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: finance-deno-formatted-${{ github.sha }}
          path: |
            supabase/functions/_shared/financialLedgerAuthority.ts
            supabase/functions/_shared/financialLedgerAuthority.test.ts
            supabase/functions/generate-bi-monthly-ledger/index.ts
            supabase/functions/generate-rescue-ledger/index.ts
          retention-days: 1

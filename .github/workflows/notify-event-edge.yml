name: Notify Event Edge contract

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/notify-event/**"
      - "supabase/functions/_shared/notifyEventAuthority.ts"
      - "supabase/functions/_shared/notifyEventAuthority.test.ts"
      - "supabase/config.toml"
      - ".github/workflows/notify-event-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x
          cache: true
      - name: Format check
        run: >-
          deno fmt --check
          supabase/functions/_shared/notifyEventAuthority.ts
          supabase/functions/_shared/notifyEventAuthority.test.ts
          supabase/functions/notify-event/index.ts
      - name: Lint
        run: >-
          deno lint
          supabase/functions/_shared/notifyEventAuthority.ts
          supabase/functions/_shared/notifyEventAuthority.test.ts
          supabase/functions/notify-event/index.ts
      - name: Contract tests
        run: deno test supabase/functions/_shared/notifyEventAuthority.test.ts
      - name: Edge type check
        run: deno check supabase/functions/notify-event/index.ts

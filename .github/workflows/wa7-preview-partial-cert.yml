name: WA7 Preview Partial Certification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wa7-preview-partial-cert.yml"
      - "supabase/functions/whatsapp-stage1b-cert-runner/**"
      - "supabase/functions/_shared/stage1bCert/**"
      - "supabase/functions/whatsapp-content-interpret/**"
      - "supabase/functions/whatsapp-packet-ai-worker/**"
      - "supabase/migrations/*whatsapp*"
      - "supabase/tests/*whatsapp*"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  partial-cert:
    name: Certify all non-physical WA7 fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WA_STAGE1B_CERT_SECRET: ${{ secrets.WA_STAGE1B_CERT_SECRET }}
      SUPABASE_CLI_VERSION: 2.117.0
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Deploy exact-head Stage1B cert runner to isolated preview
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ref="iknvsjrrfuadxhfboowl"
          test "$ref" != "tcxvcatsqqertcnycuop"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          supabase functions deploy whatsapp-stage1b-cert-runner --project-ref "$ref" --no-verify-jwt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Stage1B scoring normalization
        run: deno test --allow-read supabase/functions/_shared/stage1bCert/scoring.test.ts
      - name: Install synthetic fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-noto-core libraqm0 python3-pil python3-reportlab python3-fonttools
      - name: Pin isolated preview and generate available fixtures
        id: target
        shell: bash
        run: |
          set -euo pipefail
          ref="iknvsjrrfuadxhfboowl"
          test "$ref" != "tcxvcatsqqertcnycuop"
          echo "preview_ref=$ref" >> "$GITHUB_OUTPUT"
          export WA_STAGE1B_FIXTURE_ROOT=/tmp/wa-stage1b-cert-fixtures
          set +e
          python3 scripts/whatsapp-stage1b-cert/generate_fixtures.py > /tmp/wa7-fixtures.json
          generator_status=$?
          set -e
          if [[ "$generator_status" -ne 0 && "$generator_status" -ne 1 ]]; then
            exit "$generator_status"
          fi
          python3 - <<'PY'
          import json, pathlib
          from PIL import Image
          data=json.loads(pathlib.Path('/tmp/wa7-fixtures.json').read_text())
          generated=set(data.get('generated',[]))
          required={'01-printed-order.png','03-sku-label.png','04-product-no-sku.png','05-quantity-only.png','06-product-no-quantity.png','07-image-caption.png','08-image-correction.png','09-two-image-a.png','09-two-image-b.png','10-catalogue.png','11-po-pdf.pdf','12-payment-screenshot.png','13-complaint-photo.png','14-blurred.png','15-cropped.png','16-ambiguous-product.png','17-fake-price.png','18-fake-discount.png','19-fake-cod.png','20-prompt-injection.png','21-hindi-order.png','22-hinglish-order.png','23-misspelled-order.png','24-audio-order.mp3'}
          missing=sorted(required-generated)
          if missing:
              raise SystemExit('NON_PHYSICAL_FIXTURE_GENERATION_FAILED:'+','.join(missing))
          cropped=pathlib.Path('/tmp/wa-stage1b-cert-fixtures/15-cropped.png')
          with Image.open(cropped) as img:
              w,h=img.size
              img.crop((w//2,0,w,max(1,h//2))).save(cropped,'PNG')
          print(json.dumps({'generated_count':len(generated),'expected_physical_gap':'02-handwritten-order.png','optional_gap':'25-video-order.mp4' in data.get('skipped',[])},sort_keys=True))
          PY
      - name: Run setup, all non-physical fixtures, and Gates B-E
        shell: bash
        env:
          WA7_PREVIEW_REF: ${{ steps.target.outputs.preview_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request, urllib.error, uuid

          ref = os.environ['WA7_PREVIEW_REF']
          secret = os.environ['WA_STAGE1B_CERT_SECRET']
          if not secret:
              raise SystemExit('WA_STAGE1B_CERT_SECRET_REQUIRED')
          url = f'https://{ref}.supabase.co/functions/v1/whatsapp-stage1b-cert-runner'
          root = pathlib.Path('/tmp/wa-stage1b-cert-fixtures')
          manifest = json.loads(pathlib.Path('scripts/whatsapp-stage1b-cert/fixtures_manifest.json').read_text())
          generated = set(json.loads(pathlib.Path('/tmp/wa7-fixtures.json').read_text())['generated'])
          run_id = str(uuid.uuid4())

          def call(payload):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization': f'Bearer {secret}',
                  'Content-Type': 'application/json',
                  'X-WA-Cert-Preview-Url': f'https://{ref}.supabase.co',
              })
              try:
                  with urllib.request.urlopen(req, timeout=140) as resp:
                      return resp.status, json.loads(resp.read().decode())
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors='replace')
                  try: parsed = json.loads(body)
                  except Exception: parsed = {'error': body[:1000]}
                  return exc.code, parsed

          def semantic_pass(fixture, scores):
              if not isinstance(scores, dict):
                  return False
              if scores.get('dangerous_false_positive') is True:
                  return False
              if scores.get('invented_commercial_leakage') is True:
                  return False
              gt = fixture.get('ground_truth') or {}
              if gt.get('expect_clarification') is True and scores.get('clarification_correct') is False:
                  return False
              for gt_key, score_key in (('sku','sku_correct'),('quantity','quantity_correct'),('uom','uom_correct'),('intent','intent_correct')):
                  if gt.get(gt_key) is not None and scores.get(score_key) is False:
                      return False
              return True

          artifact_dir=pathlib.Path('artifacts/wa7-preview-partial')
          artifact_dir.mkdir(parents=True,exist_ok=True)
          status, setup = call({'phase':'setup','run_id':run_id,'core_sha':'88d6d022203c7b0ddb9442abb09c4abc238460c1','cert_branch_sha':os.environ.get('GITHUB_SHA')})
          if status >= 300:
              artifact_dir.joinpath('report.json').write_text(json.dumps({'phase':'setup','status':status,'body':setup,'preview_project_ref':ref,'run_id':run_id},indent=2)+'\n')
              print(json.dumps({'phase':'setup','status':status,'body':setup}, indent=2))
              raise SystemExit(2)
          run_tag = setup['run_tag']
          summaries=[]
          accumulated=[]
          skipped=[]
          for idx, fixture in enumerate(manifest['fixtures']):
              names = fixture.get('files') or ([fixture['file']] if fixture.get('file') else [])
              if not all(n in generated for n in names):
                  skipped.append({'id':fixture['id'],'reason':'physical_or_optional_fixture_unavailable','mandatory':not fixture.get('optional',False)})
                  continue
              files=[]
              for name in names:
                  files.append({'name':name,'base64':base64.b64encode((root/name).read_bytes()).decode()})
              payload={'phase':'fixture','run_id':run_id,'run_tag':run_tag,'fixture_index':idx,'fixture':{
                  'id':fixture['id'],'media_type':fixture['media_type'],'caption':fixture.get('caption'),
                  'follow_up_text':fixture.get('follow_up_text'),'ground_truth':fixture['ground_truth'],'files':files},
                  'core_sha':'88d6d022203c7b0ddb9442abb09c4abc238460c1','cert_branch_sha':os.environ.get('GITHUB_SHA')}
              code, body = call(payload)
              result = body.get('result',{}) if isinstance(body,dict) else {}
              scores = result.get('scores') if isinstance(result,dict) else None
              runtime_ok = code < 300 and isinstance(result,dict) and bool(result)
              semantic_ok = runtime_ok and semantic_pass(fixture, scores)
              ok = runtime_ok and semantic_ok
              summaries.append({'id':fixture['id'],'http_status':code,'ok':ok,'runtime_ok':runtime_ok,'semantic_ok':semantic_ok,'worker':result.get('worker') if isinstance(result,dict) else None,'scores':scores})
              if runtime_ok:
                  accumulated.append(result)
              print(f"fixture={fixture['id']} status={code} runtime_ok={runtime_ok} semantic_ok={semantic_ok}")
              if not ok:
                  print(json.dumps({'fixture':fixture['id'],'scores':scores,'body':body}, indent=2)[:5000])

          all_executed_passed=bool(summaries) and all(r['ok'] for r in summaries)
          gates_http_status=None
          gates_report=None
          exact_semantic_metrics=False
          partial_gates_ok=False
          if all_executed_passed:
              printed=next(f for f in manifest['fixtures'] if f['id']=='01-printed-order')
              printed_file=root/'01-printed-order.png'
              gate_c_fixture={
                  'id':printed['id'],'media_type':printed['media_type'],'caption':printed.get('caption'),
                  'follow_up_text':printed.get('follow_up_text'),'ground_truth':printed['ground_truth'],
                  'files':[{'name':'01-printed-order.png','base64':base64.b64encode(printed_file.read_bytes()).decode()}]
              }
              code, gates_body=call({
                  'phase':'gates','run_id':run_id,'run_tag':run_tag,
                  'accumulated_results':accumulated,
                  'packet_ids':[r['packet_id'] for r in accumulated if r.get('packet_id')],
                  'gate_c_fixture':gate_c_fixture,
                  'core_sha':'88d6d022203c7b0ddb9442abb09c4abc238460c1',
                  'cert_branch_sha':os.environ.get('GITHUB_SHA')
              })
              gates_http_status=code
              gates_report=gates_body.get('report') if isinstance(gates_body,dict) else None
              gate_map={g.get('gate'):g for g in (gates_report or {}).get('gates',[]) if isinstance(g,dict)}
              a=gate_map.get('A',{})
              b_to_e=[gate_map.get(letter,{}) for letter in ('B','C','D','E')]
              a_metrics=a.get('metrics') or {}
              expected_missing_handwriting=(
                  a.get('status')=='FAIL' and
                  a.get('detail')=='CONTROLLED_FIXTURE_SCORING_FAILED' and
                  int(a_metrics.get('scored',-1))==23 and
                  int(a_metrics.get('mandatory_count',-1))==24 and
                  int(a_metrics.get('dangerous_false_positives',0))==0 and
                  int(a_metrics.get('invented_commercial_leakage',0))==0
              )
              metrics=(gates_report or {}).get('metrics') or {}
              exact_semantic_metrics=(
                  metrics.get('intent_accuracy')==1 and
                  metrics.get('product_family_accuracy')==1 and
                  metrics.get('exact_sku_accuracy')==1 and
                  metrics.get('quantity_accuracy')==1 and
                  metrics.get('uom_accuracy')==1 and
                  metrics.get('clarification_correctness')==1
              )
              partial_gates_ok=expected_missing_handwriting and exact_semantic_metrics and all(g.get('status')=='PASS' for g in b_to_e)
              print(json.dumps({'gates_http_status':code,'expected_missing_handwriting':expected_missing_handwriting,'exact_semantic_metrics':exact_semantic_metrics,'metrics':metrics,'partial_gates_ok':partial_gates_ok,'gates':(gates_report or {}).get('gates')},indent=2))

          report={
              'schema_version':'wa7-preview-partial/v4','preview_project_ref':ref,'run_id':run_id,'run_tag':run_tag,
              'results':summaries,'skipped':skipped,'all_executed_passed':all_executed_passed,
              'gates_http_status':gates_http_status,'exact_semantic_metrics':exact_semantic_metrics,
              'partial_gates_ok':partial_gates_ok,'gates_report':gates_report,
              'physical_blocker':'02-handwritten-order' if any(s['id']=='02-handwritten-order' and s['mandatory'] for s in skipped) else None
          }
          artifact_dir.joinpath('report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'executed':len(summaries),'passed':sum(1 for r in summaries if r['ok']),'skipped':skipped,'all_executed_passed':all_executed_passed,'exact_semantic_metrics':exact_semantic_metrics,'partial_gates_ok':partial_gates_ok}, indent=2))
          if not all_executed_passed or not partial_gates_ok:
              raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wa7-preview-partial-cert
          path: artifacts/wa7-preview-partial/report.json
          if-no-files-found: warn

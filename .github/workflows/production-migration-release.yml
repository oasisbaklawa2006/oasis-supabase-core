name: Production Migration Release

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/verify-production-migration-ledger.sh'
      - 'scripts/check-migration-governance.sh'
      - 'scripts/check-canonical-authority.sh'
      - '.github/workflows/production-migration-release.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Apply pending migrations after verification'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-production-migration-release
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.101.0
  EXPECTED_PROJECT_REF: tcxvcatsqqertcnycuop

jobs:
  preflight:
    name: Production ledger and dry-run verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production-readonly
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout canonical main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert canonical branch and project identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main" || test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test -n "${SUPABASE_PROJECT_REF:-}"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_PROJECT_REF"
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Validate governance scripts
        run: |
          bash -n scripts/check-migration-governance.sh
          bash -n scripts/check-canonical-authority.sh
          bash -n scripts/verify-production-migration-ledger.sh

      - name: Enforce canonical backend authority
        run: bash scripts/check-canonical-authority.sh

      - name: Enforce migration governance
        run: bash scripts/check-migration-governance.sh HEAD^

      - name: Verify exact local and production ledgers
        run: bash scripts/verify-production-migration-ledger.sh

      - name: Link only to the certified production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Capture linked migration status
        shell: bash
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 | tee production-migration-list.txt

      - name: Dry-run pending production migrations
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 | tee production-db-push-dry-run.txt

      - name: Upload immutable preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-preflight-${{ github.sha }}
          path: |
            production-migration-ledger-report.txt
            production-migration-list.txt
            production-db-push-dry-run.txt
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Approved production migration deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: github.event_name == 'push' || inputs.deploy == true
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Re-verify project identity and ledger immediately before write
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_PROJECT_REF"
          bash scripts/verify-production-migration-ledger.sh
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --dry-run | tee production-db-push-final-dry-run.txt

      - name: Apply pending migrations from Core main only
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked 2>&1 | tee production-db-push-result.txt

      - name: Verify production ledger after deployment
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-production-migration-ledger.sh
          if ! grep -q '^Pending append-only versions:$' production-migration-ledger-report.txt; then
            exit 1
          fi
          pending_after="$(awk '/^Pending append-only versions:/{flag=1;next} flag{print}' production-migration-ledger-report.txt)"
          test "$pending_after" = "none"
          supabase migration list --linked | tee production-migration-list-after.txt

      - name: Run production contract smoke tests
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL' | tee production-contract-smoke.txt
          begin read only;
          select to_regprocedure('public.published_products_v1()') is not null as published_products_contract_exists;
          select to_regprocedure('public.buyer_product_prices_v1()') is not null as buyer_prices_contract_exists;
          select to_regprocedure('public.customer_order_status_v1()') is not null as order_status_contract_exists;
          select to_regprocedure('public.customer_order_items_v1()') is not null as order_items_contract_exists;
          select to_regprocedure('public.customer_support_tickets_v1()') is not null as support_tickets_contract_exists;
          rollback;
          SQL

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-deployment-${{ github.sha }}
          path: |
            production-migration-ledger-report.txt
            production-db-push-final-dry-run.txt
            production-db-push-result.txt
            production-migration-list-after.txt
            production-contract-smoke.txt
          if-no-files-found: warn
          retention-days: 365

name: Production Migration Release

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/verify-production-migration-ledger.sh'
      - 'scripts/run-production-migration-overlay.sh'
      - 'scripts/tests/**'
      - 'scripts/check-migration-governance.sh'
      - 'scripts/check-canonical-authority.sh'
      - '.github/workflows/production-migration-release.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Apply pending migrations after verification'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-production-migration-release
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.110.0
  EXPECTED_PROJECT_REF: tcxvcatsqqertcnycuop

jobs:
  preflight:
    name: Production ledger and dry-run verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production-readonly
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout canonical main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Assert canonical branch, project, and database identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test -n "${SUPABASE_PROJECT_REF:-}"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_PROJECT_REF"
          test -n "${SUPABASE_DB_URL:-}"
          [[ "$SUPABASE_DB_URL" == *"$EXPECTED_PROJECT_REF"* ]]
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Validate governance scripts
        run: |
          bash -n scripts/check-migration-governance.sh
          bash -n scripts/check-canonical-authority.sh
          bash -n scripts/verify-production-migration-ledger.sh
          bash -n scripts/run-production-migration-overlay.sh
          bash -n scripts/tests/verify-production-migration-ledger-regression.sh
          bash -n scripts/tests/verify-production-migration-overlay.sh

      - name: Run production ledger verifier regression test
        run: bash scripts/tests/verify-production-migration-ledger-regression.sh

      - name: Enforce canonical backend authority
        run: bash scripts/check-canonical-authority.sh

      - name: Enforce migration governance
        run: bash scripts/check-migration-governance.sh HEAD^

      - name: Verify exact local and production ledgers
        run: bash scripts/verify-production-migration-ledger.sh

      - name: Link only to the certified production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Capture linked migration status
        shell: bash
        run: |
          set -o pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee production-migration-list.txt

      - name: Dry-run pending production migrations
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run-production-migration-overlay.sh --dry-run 2>&1 | tee production-db-push-dry-run.txt

      - name: Upload immutable preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-preflight-${{ github.sha }}
          path: |
            production-migration-ledger-report.txt
            production-migration-list.txt
            production-db-push-dry-run.txt
          if-no-files-found: warn
          retention-days: 90

  deploy:
    name: Approved production migration deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    # Main-branch merges certify the pending ledger but must never initiate a
    # production write. Deployment requires an explicit manual dispatch and the
    # protected production environment approval.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Re-verify project, database identity, and ledger immediately before write
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_PROJECT_REF"
          [[ "$SUPABASE_DB_URL" == *"$EXPECTED_PROJECT_REF"* ]]
          bash scripts/verify-production-migration-ledger.sh
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          bash scripts/run-production-migration-overlay.sh --dry-run 2>&1 | tee production-db-push-final-dry-run.txt

      - name: Apply pending migrations from Core main only
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run-production-migration-overlay.sh --apply 2>&1 | tee production-db-push-result.txt

      - name: Verify production ledger after deployment
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-production-migration-ledger.sh
          pending_after="$(awk '/^Pending append-only versions:/{flag=1;next} flag{print}' production-migration-ledger-report.txt)"
          test "$pending_after" = "none"
          supabase migration list --linked | tee production-migration-list-after.txt

      - name: Run production contract smoke tests
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL' | tee production-contract-smoke.txt
          begin read only;
          do $$
          begin
            if to_regprocedure('public.published_products_v1()') is null
              or to_regprocedure('public.buyer_product_prices_v1()') is null
              or to_regprocedure('public.customer_order_status_v1()') is null
              or to_regprocedure('public.customer_order_items_v1()') is null
              or to_regprocedure('public.customer_support_tickets_v1()') is null then
              raise exception 'Required customer contract function is missing';
            end if;
          end
          $$;
          rollback;
          SQL

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-deployment-${{ github.sha }}
          path: |
            production-migration-ledger-report.txt
            production-db-push-final-dry-run.txt
            production-db-push-result.txt
            production-migration-list-after.txt
            production-contract-smoke.txt
          if-no-files-found: warn
          retention-days: 365

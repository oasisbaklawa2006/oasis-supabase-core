name: Auto Production Migration Dispatch

on:
  workflow_run:
    workflows: ["Production Migration Release"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-production-migration-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch protected production migration release
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Download certified push-range metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RELEASE_RUN_ID" \
            --repo "$REPO" \
            --name "production-migration-preflight-${RELEASE_SHA}" \
            --dir preflight-evidence
          test -s preflight-evidence/production-release-context.env

      - name: Assert certified release is current main before checkout
        id: precheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          read_context_value() {
            local key="$1"
            local line
            line="$(grep -E "^${key}=" preflight-evidence/production-release-context.env | tail -n1)"
            printf '%s' "${line#*=}"
          }

          current_main_sha="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"
          if [[ "$current_main_sha" != "$RELEASE_SHA" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skip: main advanced from release SHA ${RELEASE_SHA} to ${current_main_sha}; the newer push owns the next release."
            exit 0
          fi

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          CONTEXT_EVENT_NAME="$(read_context_value CONTEXT_EVENT_NAME)"
          CONTEXT_RELEASE_SHA="$(read_context_value CONTEXT_RELEASE_SHA)"
          CONTEXT_PUSH_BEFORE="$(read_context_value CONTEXT_PUSH_BEFORE)"

          test "${CONTEXT_EVENT_NAME:-}" = "push"
          test "${CONTEXT_RELEASE_SHA:-}" = "$RELEASE_SHA"
          test -n "${CONTEXT_PUSH_BEFORE:-}"
          [[ "$CONTEXT_PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/${REPO}/commits/${CONTEXT_PUSH_BEFORE}" --jq '.sha' >/dev/null
          gh api "repos/${REPO}/commits/${RELEASE_SHA}" --jq '.sha' >/dev/null

          {
            echo "proceed=true"
            echo "context_push_before=${CONTEXT_PUSH_BEFORE}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout certified main history for local push-range diff
        if: steps.precheck.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main head and full migration-bearing push range
        id: gate
        if: steps.precheck.outputs.proceed == 'true'
        env:
          CONTEXT_PUSH_BEFORE: ${{ steps.precheck.outputs.context_push_before }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          if ! git rev-parse --verify "${CONTEXT_PUSH_BEFORE}^{commit}" >/dev/null; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "Skip: certified push base ${CONTEXT_PUSH_BEFORE} is not present in local history."
            exit 0
          fi

          retry_marker="docs/governance/PRODUCTION_MIGRATION_RELEASE_RETRY.env"
          migration_changes="$(git diff --name-only "$CONTEXT_PUSH_BEFORE" "$RELEASE_SHA" -- supabase/migrations/)"
          retry_marker_changes="$(git diff --name-only "$CONTEXT_PUSH_BEFORE" "$RELEASE_SHA" -- "$retry_marker")"

          if [[ -n "$migration_changes" ]]; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            echo "Migration-bearing exact-main push range certified for automatic protected dispatch:"
            printf '%s\n' "$migration_changes"
            exit 0
          fi

          if [[ -z "$retry_marker_changes" ]]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "Skip: successful Production Migration Release push contained neither a migration-file change nor a reviewed release-retry marker change."
            exit 0
          fi

          # A retry marker is a code-owned, one-parent authorization for already-pending
          # migrations. It cannot add schema work: the successful protected preflight must
          # prove that the production ledger's exact pending set equals the marker's set.
          test -s "$retry_marker"
          test -s preflight-evidence/production-migration-ledger-report.txt
          test -s preflight-evidence/production-db-push-dry-run.txt

          read_marker_value() {
            local key="$1"
            test "$(grep -Ec "^${key}=" "$retry_marker")" -eq 1
            grep -E "^${key}=" "$retry_marker" | cut -d= -f2-
          }

          authorized_parent="$(read_marker_value AUTHORIZED_PARENT_SHA)"
          expected_csv="$(read_marker_value EXPECTED_PENDING_VERSIONS)"

          [[ "$authorized_parent" =~ ^[0-9a-f]{40}$ ]]
          test "$authorized_parent" = "$CONTEXT_PUSH_BEFORE"
          [[ "$expected_csv" =~ ^[0-9]{14}(,[0-9]{14})*$ ]]

          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          trap 'rm -f "$expected_file" "$actual_file"' EXIT

          printf '%s\n' "$expected_csv" | tr ',' '\n' | sort -u > "$expected_file"
          awk '/^Pending append-only versions:/{flag=1;next} flag{print}' \
            preflight-evidence/production-migration-ledger-report.txt \
            | sed '/^[[:space:]]*$/d;/^none$/d' \
            | sort -u > "$actual_file"

          test -s "$expected_file"
          diff -u "$expected_file" "$actual_file"

          while IFS= read -r version; do
            mapfile -t matching_migrations < <(compgen -G "supabase/migrations/${version}_*.sql" || true)
            test "${#matching_migrations[@]}" -eq 1
            grep -Fq "$(basename "${matching_migrations[0]}")" preflight-evidence/production-db-push-dry-run.txt
          done < "$expected_file"

          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "Reviewed release-retry marker certified for exact pending migration set:"
          cat "$expected_file"

      - name: Dispatch deploy=true bound to certified release SHA
        if: steps.gate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"
          if [[ "$current_main_sha" != "$RELEASE_SHA" ]]; then
            echo "Skip: main advanced before dispatch; newer main owns the next release."
            exit 0
          fi

          gh workflow run production-migration-release.yml \
            --repo "$REPO" \
            --ref main \
            -f deploy=true \
            -f release_sha="$RELEASE_SHA"
          echo "Protected Production Migration Release dispatched with deploy=true and release_sha=${RELEASE_SHA}."

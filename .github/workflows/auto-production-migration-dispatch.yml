name: Auto Production Migration Dispatch

on:
  workflow_run:
    workflows: ["Production Migration Release"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-production-migration-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch protected production migration release
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact main head and migration-bearing merge
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          current_main_sha="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"
          if [[ "$current_main_sha" != "$RELEASE_SHA" ]]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "Skip: main advanced from release SHA ${RELEASE_SHA} to ${current_main_sha}; the newer push owns the next release."
            exit 0
          fi

          migration_changes="$(gh api "repos/${REPO}/commits/${RELEASE_SHA}" --paginate --jq '.files[]?.filename' | grep '^supabase/migrations/' || true)"
          if [[ -z "$migration_changes" ]]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "Skip: successful Production Migration Release push contained no migration-file change."
            exit 0
          fi

          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "Migration-bearing exact-main push certified for automatic protected dispatch:"
          printf '%s\n' "$migration_changes"

      - name: Dispatch deploy=true on current main
        if: steps.gate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-migration-release.yml \
            --repo "$REPO" \
            --ref main \
            -f deploy=true
          echo "Protected Production Migration Release dispatched with deploy=true."

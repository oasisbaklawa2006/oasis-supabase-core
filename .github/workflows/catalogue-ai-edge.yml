name: Catalogue AI Edge contract

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/catalogue-ai-copy/**"
      - "supabase/functions/_shared/catalogueAiCopy.ts"
      - "supabase/functions/_shared/catalogueAiCopy.test.ts"
      - ".github/workflows/catalogue-ai-edge.yml"
      - ".github/workflows/catalogue-ai-copy-production-release.yml"
      - "scripts/check-catalogue-ai-copy-production-release.rb"
      - "scripts/tests/verify-catalogue-ai-copy-production-release.rb"
      - "scripts/verify-catalogue-ai-zero-spend-secrets.py"
      - ".github/workflows/studio-ai-copy-qa-preflight.yml"
      - ".github/workflows/studio-ai-copy-qa-commission.yml"
      - "scripts/tests/test_studio_qa_commission.rb"
      - "scripts/studio-qa/**"
      - "scripts/tests/test_studio_qa_ai_copy.py"
      - "scripts/tests/test_studio_qa_bundle.py"
      - "scripts/edge-function-source-manifest.py"
      - "scripts/genie-qa/verify_qa_target.py"
      - "scripts/detect-pr-edge-governance-paths.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x
          cache: true
      - name: Format check
        run: >-
          deno fmt --check
          supabase/functions/_shared/catalogueAiCopy.ts
          supabase/functions/_shared/catalogueAiCopy.test.ts
          supabase/functions/catalogue-ai-copy/index.ts
      - name: Lint
        run: >-
          deno lint
          supabase/functions/_shared/catalogueAiCopy.ts
          supabase/functions/_shared/catalogueAiCopy.test.ts
          supabase/functions/catalogue-ai-copy/index.ts
      - name: Contract tests
        run: deno test supabase/functions/_shared/catalogueAiCopy.test.ts
      - name: Edge type check
        run: deno check supabase/functions/catalogue-ai-copy/index.ts
      - name: Named-function protected release policy and negative cases
        run: |
          ruby scripts/check-catalogue-ai-copy-production-release.rb
          ruby scripts/tests/verify-catalogue-ai-copy-production-release.rb
          python3 scripts/verify-catalogue-ai-zero-spend-secrets.py --self-test
      - name: Inert QA preview proof, secrets isolation and workflow negative tests
        run: |
          ruby scripts/studio-qa/verify_preflight.rb
          ruby scripts/studio-qa/verify_commission.rb
          ruby scripts/tests/test_studio_qa_commission.rb
          python3 -I -m unittest discover -s scripts/tests -p "test_studio_qa_ai_copy.py" -v
          python3 -I -m unittest discover -s scripts/tests -p "test_studio_qa_bundle.py" -v
          workdir="$(mktemp -d)"
          python3 scripts/studio-qa/build_inert_copy.py \
            --source supabase/functions/catalogue-ai-copy/index.ts \
            --helper supabase/functions/_shared/catalogueAiCopy.ts \
            --output-dir "$workdir/functions"
          # Validate the generated provider-inert source, not just canonical Core.
          deno lint "$workdir/functions/catalogue-ai-copy/index.ts" \
            "$workdir/functions/_shared/catalogueAiCopy.ts"

name: Step 1 Staging Certification (RETIRED)

# =================================================================================
# RETIRED 2026-08-18 as part of the production migration lineage recovery.
#
# This workflow's EXPECTED_PROJECT_REF / SUPABASE_URL always pointed at
# tcxvcatsqqertcnycuop -- which docs/runbooks/CONTROLLED_SUPABASE_PRODUCTION_RELEASE.md
# names explicitly as PRODUCTION ("Production project ref: tcxvcatsqqertcnycuop...
# No other repository, workstation, chat thread, SQL editor or dashboard is an
# authorized production migration source"). There is no separate staging Supabase
# project in this organization. This workflow's name and PR descriptions that
# referenced it ("staging", "Production has not been touched") reflected a
# genuine, good-faith but incorrect belief that this database had a safe
# non-production mode -- the same belief that produced the migration-lineage
# divergence this recovery closes (17 migrations applied here directly, under
# generated timestamps, in the belief that "staging" application was safe and
# separate from a later "real" deployment; see
# docs/reconciliation/production-migration-ledger-remote-history-2026-08-18.csv).
#
# This workflow ran two production-write paths outside the governed release
# gate: (1) a raw `psql -f <migration>` loop with no ledger check, no dry-run,
# no environment-protection approval; (2) scripts/step1-certification/run.mjs,
# which creates/patches real rows (test users, direct table patches) against
# the same live database. Per the runbook, the ONLY authorized production
# migration write path is the `Production Migration Release` workflow
# (.github/workflows/production-migration-release.yml), gated by the
# `supabase-production` GitHub Environment's required-reviewer approval.
#
# This job is retired to fail closed rather than deleted, so its prior run
# history and artifacts remain visible for audit. If a genuine, separate
# staging Supabase project is provisioned in the future, this workflow may be
# restored against that project's own ref/URL/secrets -- never against
# tcxvcatsqqertcnycuop.
# =================================================================================

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired -- see workflow file header
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "::error::Step 1 Staging Certification is retired. It targeted tcxvcatsqqertcnycuop, which is PRODUCTION per docs/runbooks/CONTROLLED_SUPABASE_PRODUCTION_RELEASE.md, not a separate staging project. See this workflow file's header comment for the full rationale. The only authorized production migration write path is Production Migration Release."
          exit 1

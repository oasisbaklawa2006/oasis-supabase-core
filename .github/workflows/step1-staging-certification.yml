name: Step 1 Staging Certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/step1-staging-certification.yml'
      - 'scripts/step1-certification/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step1-staging-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Authenticated staging authority certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PROJECT_REF: tcxvcatsqqertcnycuop
      SUPABASE_URL: https://tcxvcatsqqertcnycuop.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_UbNV2X25YHY3cupjpoLsjw_RhlDG4f_
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CENTRAL_CERTIFIED_SHA: 0ace2a2d9e77f4624caa023ad426ddcebb86d009
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify staging target and required secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          [[ "$SUPABASE_URL" == "https://${EXPECTED_PROJECT_REF}.supabase.co" ]]
          [[ "$SUPABASE_DB_URL" == *"$EXPECTED_PROJECT_REF"* ]]

      - name: Prove credential redaction before staging access
        run: node scripts/step1-certification/safe-run.mjs --self-test

      - name: Apply exact certification authority definitions to staging
        run: |
          set -euo pipefail
          for migration in \
            supabase/migrations/20260809060000_wave1b_server_authority_foundation.sql \
            supabase/migrations/20260809070000_wave1c_authority_closure.sql \
            supabase/migrations/20260809080000_wave1c_gate_destination_state_fix.sql \
            supabase/migrations/20260809080100_wave1c_wa_promotion_returning_fix.sql \
            supabase/migrations/20260809080200_wave1c_confirm_rpc_financials_authority.sql
          do
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done

      - name: Run authenticated staging certification through redaction boundary
        id: certification
        run: node scripts/step1-certification/safe-run.mjs

      - name: Upload credential-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step1-certification-evidence-${{ github.run_id }}
          path: artifacts/step1-certification/
          if-no-files-found: error
          retention-days: 30

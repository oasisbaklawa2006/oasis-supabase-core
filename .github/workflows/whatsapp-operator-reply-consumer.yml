name: WhatsApp Operator Reply Consumer

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/whatsapp-operator-reply-consumer/**"
      - "supabase/functions/_shared/whatsappOperatorReplyDispatch.ts"
      - "supabase/functions/_shared/whatsappProviderAcceptance.ts"
      - "supabase/migrations/20260919130000_whatsapp_operator_reply_quarantine_and_consumer_hardening.sql"
      - "supabase/migrations/20260919140000_whatsapp_operator_reply_consumer_scheduler.sql"
      - "supabase/tests/20260919130000_whatsapp_operator_reply_consumer_hardening.sql"
      - "supabase/tests/20260919140000_whatsapp_operator_reply_consumer_scheduler.sql"
      - "supabase/config.toml"
      - "scripts/check-edge-registry-config-reconciliation.sh"
      - ".github/workflows/whatsapp-operator-reply-consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05
        with:
          deno-version: v2.x
          cache: true
      - name: Format check
        run: >-
          deno fmt --check
          supabase/functions/whatsapp-operator-reply-consumer/index.ts
          supabase/functions/whatsapp-operator-reply-consumer/index.test.ts
          supabase/functions/_shared/whatsappOperatorReplyDispatch.ts
          supabase/functions/_shared/whatsappProviderAcceptance.ts
      - name: Lint
        run: >-
          deno lint
          supabase/functions/whatsapp-operator-reply-consumer/index.ts
          supabase/functions/whatsapp-operator-reply-consumer/index.test.ts
          supabase/functions/_shared/whatsappOperatorReplyDispatch.ts
          supabase/functions/_shared/whatsappProviderAcceptance.ts
      - name: Unit tests
        run: >-
          deno test --allow-env --allow-net
          supabase/functions/whatsapp-operator-reply-consumer/index.test.ts
      - name: Type check
        run: deno check supabase/functions/whatsapp-operator-reply-consumer/index.ts
      - name: Registry contract
        run: bash scripts/check-edge-registry-config-reconciliation.sh
